<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>추가옵션 계산기</title>
<meta name="description" content="원하는 추가옵션의 성공 확률, 환생의 불꽃 평균 사용량과 메소 비용을 계산하세요.">
<link rel="icon" href="favicon.png?v=2">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="site_ux.css">
<link rel="stylesheet" href="flame_calc.css">
<script src="site_header.js" defer></script>
<script src="site_nav.js" defer></script>
<script src="site_ux.js" defer></script>
</head>
<body>
<div class="wrap">
  <div data-site-navigation></div>
<header class="fc-header">
  <h1>추가옵션 계산기</h1>
  <p class="sub">목표 추가옵션의 성공 확률과 평균 불꽃 사용량을 확인하세요.</p>
</header>
<main class="fc-layout">
  <section aria-label="추가옵션 설정">
    <div class="ic-panel">
      <h2>장비 설정 <button type="button" class="ic-reset" id="resetAll">설정 초기화</button></h2>
      <div class="ic-fields">
        <div class="ic-field"><label for="level">아이템 레벨</label><div class="ic-level-control"><button type="button" class="ic-level-step" data-level-step="-10" aria-label="아이템 레벨 10 감소">−</button><input type="number" id="level" min="1" max="300" step="1" inputmode="numeric"><button type="button" class="ic-level-step" data-level-step="10" aria-label="아이템 레벨 10 증가">+</button></div></div>
        <div class="ic-field"><label for="part">장비 구분</label><select id="part"></select></div>
      </div>
      <div class="ic-fields fc-weapon-fields">
        <div class="ic-field" id="weaponField"><label for="weapon">무기 종류</label><select id="weapon"></select></div>
      </div>
      <div id="weaponVariants" class="ic-chips fc-variants" role="group" aria-label="200레벨 무기" hidden></div>
      <div id="armorLevels" class="ic-chips fc-variants" role="group" aria-label="방어구 참고 레벨" hidden></div>
    </div>
    <div class="ic-panel"><h2>추옵 설정</h2><div id="flameBody"></div></div>
  </section>
  <aside class="ic-panel fc-result" aria-labelledby="resultTitle"><h2 id="resultTitle">목표 달성 예상</h2><div id="flameResult" aria-live="polite" aria-atomic="true"></div><h2>선택한 추가옵션 합계</h2><div id="optionTotal" aria-live="polite"></div></aside>
</main>
<details class="ic-panel" id="weaponReference"><summary>1추부터 5추까지</summary><div id="weaponTable"></div><p class="ic-note">수치는 추가옵션으로 붙는 증가량입니다. <a id="weaponSource" href="https://matsu1207.tistory.com/402" target="_blank" rel="noopener">무기 공·마 수치 출처: 정심심</a></p><div id="allOptionTable"></div></details>
</div>
<script src="flame_core.js"></script>
<script src="flame_weapon_data.js"></script>
<script src="money_input.js"></script>
<script src="flame_calc.js"></script>
</body>
</html>
