<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메이플 옥션 연결</title>
<main>
  <h1>메이플 옥션 연결</h1>
  <p>웹 옥션에서 로그인한 뒤, 로컬 계산기를 시작한 터미널에 나온 연결 키를 입력하세요.</p>
  <form>
    <label>연결 키 <input type="password" autocomplete="off" required pattern="[0-9a-f]{64}"></label>
    <button type="submit">연결</button>
    <button type="button" id="disconnect" disabled>연결 끊기</button>
  </form>
  <p role="status">연결 대기 중입니다.</p>
  <p><a href="https://auction.maplestory.nexon.com/" target="_blank" rel="noopener">웹 옥션 열기</a></p>
</main>
<script type="module" src="connect.mjs"></script>
</html>
