<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>메이플 계산기 모음</title>
<link rel="stylesheet" href="style.css" />
<style>
  .tool-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px, 1fr));
    gap:16px;
    margin-top:20px;
  }
  .tool-card{
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 22px 20px;
    text-decoration:none;
    color:var(--text);
    transition:border-color .15s, transform .15s;
  }
  .tool-card:hover{
    border-color:var(--accent-strong);
    transform:translateY(-2px);
  }
  .tool-card h2{
    margin:0 0 8px;
    font-size:1.15rem;
  }
  .tool-card p{
    margin:0;
    color:var(--text-dim);
    font-size:0.88rem;
    line-height:1.6;
  }
  .tool-card .go{
    display:inline-block;
    margin-top:14px;
    font-size:0.82rem;
    font-weight:600;
    color:var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>메이플 계산기 모음</h1>
    <p class="sub">필요할 때 꺼내 쓰는 메이플스토리 계산기들</p>
  </header>

  <div class="tool-grid">
    <a class="tool-card" href="trace_calc.html">
      <h2>주흔 기댓값 계산기</h2>
      <p>아케인셰이드 / 이노센트·아크이노센트 / 순백 주문서 — 주흔작 완성까지 기대 비용(메소·시도 횟수)을 계산합니다.</p>
      <span class="go">계산기 열기 →</span>
    </a>

    <a class="tool-card" href="authentic_symbol_calc.html">
      <h2>어센틱 심볼 계산기</h2>
      <p>그랜디스 지역 심볼 강화 계산기. 목표 어센틱 포스까지 최소 메소로 도달하는 강화 순서를 자동으로 계산합니다.</p>
      <span class="go">계산기 열기 →</span>
    </a>
  </div>
</div>
</body>
</html>
