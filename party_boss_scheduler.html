<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>파티 보스 스케줄러</title><link rel="icon" type="image/webp" href="icons/home/탐정수첩.webp">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site_ux.css"><link rel="stylesheet" href="site_tooltips.css"><link rel="stylesheet" href="boss_workspace.css"><link rel="stylesheet" href="party_boss_scheduler.css"><link rel="stylesheet" href="boss_identity.css"><link rel="stylesheet" href="boss_difficulty.css">
  <script src="site_header.js" defer></script><script src="site_nav.js" defer></script><script src="site_help_data.js" defer></script>
<script src="site_help.js" defer></script>
<script src="site_ux.js" defer></script>
  <script src="nexon_key.js" defer></script><script src="nexon_characters.js" defer></script><script src="boss_db.js" defer></script><script src="boss_rewards.js" defer></script><script src="scouter_data.js" defer></script><script src="rate_catalog.js" defer></script><script src="account_catalog.js" defer></script><script src="character_profile.js" defer></script><script src="boss_identity.js" defer></script><script src="site_tooltips.js" defer></script><script src="party_boss_scheduler.js" defer></script>
</head>
<body><main class="wrap boss-app party-app">
  <div data-site-navigation></div>
  <header><h1>파티 보스 스케줄러</h1><p class="sub">공용 배율로 함께 갈 보스 파티를 구성하세요.</p></header>
  <div class="party-scope-tabs" role="tablist" aria-label="파티 저장 위치">
    <button id="party-scope-local" class="ux-button" type="button" role="tab" aria-selected="true" aria-controls="party-scope-panel"><span class="site-tab-icon" aria-hidden="true"><svg class="site-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></svg></span>로컬</button>
    <button id="party-scope-shared" class="ux-button" type="button" role="tab" aria-selected="false" aria-controls="party-scope-panel" tabindex="-1"><span class="site-tab-icon" aria-hidden="true"><svg class="site-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h11a4 4 0 0 0 0-8h-1a6 6 0 0 0-11.7-1.8A5 5 0 0 0 7 18Z"/></svg></span>공유</button>
  </div>
  <section id="party-scope-panel" role="tabpanel" aria-labelledby="party-scope-local">
  <div class="party-scope-info">
    <p id="party-scope-note" class="boss-status" role="status">이 브라우저에서만 볼 수 있습니다.</p>
    <button id="party-refresh-shared" class="ux-button" type="button" hidden>공유 목록 새로고침</button>
  </div>
  <div class="party-board-head"><h2>파티 목록</h2><button id="party-create-toggle" class="boss-primary" type="button" aria-expanded="false" aria-controls="party-create-form">파티 만들기</button></div>
  <div class="party-view-controls" role="group" aria-label="파티 목록 필터">
    <button id="party-view-all" class="ux-button" type="button" aria-pressed="true">전체 파티</button>
    <button id="party-view-mine" class="ux-button" type="button" aria-pressed="false">내 캐릭터</button>
    <button id="party-open-filter" class="ux-button" type="button" aria-haspopup="dialog" aria-controls="party-filter-dialog">보스·계정·캐릭터 찾기</button>
  </div>
  <div class="party-view-controls party-view-state"><p id="party-view-count" class="party-note" role="status"></p><button id="party-clear-filter" class="ux-button" type="button" hidden><span id="party-active-filter"></span> <span aria-hidden="true">×</span></button></div>
  <p id="party-filter-status" class="boss-status" role="status"></p>
  <form id="party-create-form" class="card party-create-form" hidden>
    <div class="boss-section-head"><h2 id="party-form-title">새 파티</h2><button id="party-create-cancel" type="button">취소</button></div>
    <div class="party-form-grid">
      <div class="party-boss-field"><span id="party-boss-label">보스와 난이도</span><select id="party-boss" hidden aria-hidden="true" tabindex="-1"></select><button id="party-open-boss" class="ux-button" type="button" aria-haspopup="dialog" aria-controls="party-boss-dialog" aria-labelledby="party-boss-label party-open-boss">보스 선택</button></div>
      <label>파티 이름<input id="party-name" maxlength="60" placeholder="비우면 보스와 난이도 이름 사용"></label>
    </div>
    <div id="party-draft-summary"></div>
    <div class="party-draft-picker"><label>계정<select id="party-draft-account"><option value="">전체 계정</option></select></label><label>캐릭터<select id="party-draft-character"><option value="">캐릭터 선택</option></select></label><button id="party-draft-add" class="boss-primary" type="button">추가</button></div>
    <div id="party-draft-members" class="party-members"></div><p id="party-draft-status" class="boss-status" role="status"></p><div class="party-form-footer"><span id="party-draft-scope" class="party-note">이 브라우저에 저장</span><button id="party-save" class="boss-primary" type="submit">파티 저장</button></div>
  </form>
  <p id="party-storage-status" class="boss-status" role="status"></p>
  <div class="party-board"><div class="party-list-pane">
    <div class="party-list-tools">
      <label class="party-list-search"><span class="sr-only">파티 검색</span><input id="party-list-search" type="search" maxlength="40" placeholder="보스나 캐릭터 검색" autocomplete="off" aria-controls="party-list"></label>
      <label class="party-list-sort"><span>정렬</span><select id="party-sort" aria-controls="party-list"><option value="boss">보스 순</option><option value="remaining">남은 파티 먼저</option><option value="total-desc">환산 합계 높은 순</option><option value="total-asc">환산 합계 낮은 순</option><option value="recent">최근 만든 순</option></select></label>
    </div>
    <aside id="party-list" class="party-list" aria-label="파티 목록"></aside>
  </div><div class="party-content"><section id="party-detail" class="card party-detail" aria-label="선택한 파티">
    <div id="party-detail-heading"></div>
    <div id="party-detail-content"></div>
  </section>
    <section class="card party-search" id="party-add-panel" aria-labelledby="search-title" hidden>
      <div class="boss-section-head"><h2 id="search-title">파티원 추가</h2><button id="party-reload-catalog" class="boss-icon-button" type="button" aria-label="공용 캐릭터 새로고침" title="새로고침">↻</button></div>
      <div class="party-add-row"><label>계정<select id="party-account"><option value="">전체 계정</option></select></label><label>캐릭터<select id="party-saved-character" disabled><option value="">불러오는 중…</option></select></label><button id="party-add-current" class="boss-primary" type="button" disabled>추가</button></div>
      <p id="party-search-status" class="boss-status" role="status" aria-live="polite"></p><div id="party-character-preview" class="party-character-preview" hidden></div>
    </section>
  </div></div>
  </section>
  <dialog id="party-boss-dialog" class="ux-confirm party-boss-dialog" aria-labelledby="party-boss-dialog-title">
    <div class="party-boss-dialog-head"><h2 id="party-boss-dialog-title">보스 선택</h2><button id="party-close-boss" class="ux-button" type="button">닫기</button></div>
    <section id="party-recent-bosses" hidden><h3>최근 선택</h3><div id="party-recent-list" class="party-boss-grid"></div></section>
    <label id="party-boss-search">보스 검색<input id="party-boss-query" type="search" placeholder="보스 이름이나 별칭 검색" autocomplete="off" aria-controls="party-boss-results"></label>
    <div id="party-boss-results" class="party-boss-grid"></div>
    <p id="party-boss-empty" class="boss-status" role="status" hidden>검색 결과가 없습니다. 다른 이름으로 찾아보세요.</p>
    <section id="party-boss-difficulty" hidden><div class="party-boss-dialog-head"><h3 id="party-difficulty-title">난이도 선택</h3><button id="party-boss-back" class="ux-button" type="button">보스 목록</button></div><div id="party-difficulty-options" class="party-boss-difficulties diff-options" role="group" aria-labelledby="party-difficulty-title"></div></section>
  </dialog>
  <dialog id="party-filter-dialog" class="ux-confirm party-boss-dialog" aria-labelledby="party-filter-title">
    <div class="party-boss-dialog-head"><h2 id="party-filter-title">파티 찾기</h2><button id="party-close-filter" class="ux-button" type="button">닫기</button></div>
    <label>보스 이름, 별칭, 계정 이름 또는 닉네임<input id="party-filter-query" type="search" autocomplete="off" aria-controls="party-filter-results"></label>
    <div id="party-filter-results" class="party-filter-results"></div>
    <p id="party-filter-empty" class="boss-status" role="status" hidden>검색 결과가 없습니다. 다른 이름으로 찾아보세요.</p>
  </dialog>
  <footer class="boss-data-credit">Data based on NEXON Open API</footer>
</main></body></html>
