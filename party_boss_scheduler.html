<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>파티 보스 스케줄러</title>
  <link rel="icon" href="favicon.png?v=2">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="party_boss_scheduler.css">
  <script src="nexon_key.js" defer></script>
  <script src="nexon_characters.js" defer></script>
  <script src="boss_db.js" defer></script>
  <script src="scouter_data.js" defer></script>
  <script src="party_boss_scheduler.js" defer></script>
</head>
<body>
<main class="wrap party-app">
  <header class="party-page-header">
    <div><a href="index.html">메이플 계산기 모음</a> · <a href="shared_boss_rates.html">공용 저장 배율 보기</a><h1>파티 보스 스케줄러</h1><p class="sub">캐릭터 외형을 확인하고 함께 갈 보스 파티를 구성하세요.</p></div>
    <span class="party-local">이 브라우저에 저장 · 공유 기능 준비 중</span>
  </header>
  <section class="party-search" aria-labelledby="search-title">
    <div class="party-search-main">
      <h2 id="search-title">캐릭터 검색</h2>
      <p id="party-key-state" class="party-note"></p>
      <label class="party-field" for="party-my-character">내 계정 캐릭터</label>
      <div class="party-search-row"><select id="party-my-character" disabled><option value="">계정 캐릭터를 불러오는 중…</option></select><button id="party-reload-account" type="button">목록 새로고침</button></div>
      <form id="party-search-form" class="party-search-row">
        <label class="sr-only" for="party-character-name">캐릭터 닉네임</label>
        <input id="party-character-name" maxlength="30" placeholder="다른 계정도 닉네임으로 검색" required>
        <button type="submit" class="party-primary" id="party-search-button">캐릭터 검색</button>
      </form>
      <p id="party-search-status" class="party-note" role="status" aria-live="polite"></p>
    </div>
    <div id="party-character-preview" class="party-character-preview"><p class="party-note">캐릭터를 선택하면 현재 외형이 표시됩니다.</p></div>
  </section>
  <div class="party-board-head"><h2>파티 목록</h2><div class="party-search-row"><label for="party-view">보기</label><select id="party-view"><option value="all">저장한 전체 파티</option><option value="mine">내 캐릭터가 있는 파티</option></select><button id="party-create-toggle" class="party-primary" type="button" aria-expanded="false" aria-controls="party-create-form">파티 만들기</button></div></div>
  <form id="party-create-form" class="party-create-form" hidden>
    <div class="party-form-grid">
      <label class="party-field">파티 이름<input id="party-name" maxlength="60" placeholder="예: 금요일 저녁팟" required></label>
      <label class="party-field">보스 · 난이도<select id="party-boss" required></select></label>
      <label class="party-field">일정 · 선택<input id="party-schedule" maxlength="80" placeholder="예: 매주 금요일 21:00"></label>
    </div>
    <button class="party-primary" type="submit">파티 저장</button>
  </form>
  <p id="party-storage-status" class="party-note" role="status"></p>
  <div class="party-board"><div id="party-list" class="party-list" aria-label="파티 목록"></div><section id="party-detail" class="party-detail" aria-label="선택한 파티"></section></div>
  <p class="party-note">‘환산 배율 불러오기’를 누르면 선택한 캐릭터 한 명만 조회합니다. 받아온 보스별 배율은 해당 캐릭터가 속한 파티에 반영해 합산합니다. 합계는 개인 배율을 더한 참고값입니다. 클리어 동기화는 준비 중입니다.</p>
</main>
</body>
</html>
