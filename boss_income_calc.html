<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>보스 수익 정산 계산기</title>
<link rel="stylesheet" href="style.css" />
<style>
  :root{ --surface-2:#1d212b; }
  body{ padding-bottom:24px; }

  /* character chips */
  .char-add-row{ display:flex; gap:10px; flex-wrap:wrap; }

  .char-chip-list{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px; margin-top:20px; }
  .char-chip{
    display:grid;
    grid-template-columns:1fr auto;
    align-content:start;
    align-items:center;
    gap:14px;
    padding:20px;
    border-radius:14px;
    border:1px solid var(--border);
    background:#11141a;
    color:var(--text-dim);
    font-weight:700;
    font-size:1.15rem;
    cursor:pointer;
  }
  .char-chip:hover{ border-color:var(--accent); color:var(--text); }
  .char-chip.active{ border-color:var(--accent-strong); background:#1c2740; color:var(--text); }
  .char-chip .chip-meso{ grid-column:1/-1; font-size:1.5rem; color:var(--accent); font-weight:800; font-variant-numeric:tabular-nums; }
  .char-chip .chip-name{ width:100%; min-width:0; padding:10px 12px; border:1px solid #52617a; border-radius:8px; background:#0d121b; color:var(--text); font:inherit; cursor:text; }
  .char-chip .chip-name:hover{ border-color:var(--accent); }
  .char-chip .chip-name:focus{ outline:2px solid var(--accent); outline-offset:2px; }
  .char-chip .chip-del{
    width:32px; height:32px;
    border-radius:50%;
    border:none;
    background:rgba(226,102,74,0.15);
    color:var(--bad);
    font-size:18px;
    font-weight:800;
    line-height:30px;
    text-align:center;
    cursor:pointer;
    flex-shrink:0;
  }
  .char-chip .chip-del:hover{ background:var(--bad); color:#fff; }
  .empty-note{ color:var(--text-dim); font-size:0.85rem; padding:6px 0; }

  /* boss list */
  .weekly-quota{
    font-size:0.8rem;
    font-weight:700;
    color:var(--text-dim);
  }
  .weekly-quota.warn{ color:var(--bad); }
  .boss-panel-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
  }

  .boss-list{
    display:flex;
    flex-direction:column;
    margin-top:14px;
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .boss-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 12px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
    flex-wrap:wrap;
    transition:background .15s;
  }
  .boss-row:last-child{ border-bottom:none; }
  .boss-row.selected{ background:#1c2740; }

  .boss-icon{
    width:28px; height:28px;
    border-radius:7px;
    object-fit:cover;
    image-rendering:pixelated;
    flex-shrink:0;
    background:#11141a;
    border:1px solid var(--border);
  }
  .boss-icon-fallback{
    width:28px; height:28px;
    border-radius:7px;
    flex-shrink:0;
    background:#11141a;
    border:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:11px;
    color:var(--text-dim);
  }
  .boss-name-wrap{
    display:flex;
    align-items:center;
    gap:6px;
    width:172px;
    flex-shrink:0;
  }
  .boss-name{ font-weight:700; font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .boss-check-badge{
    font-size:0.62rem;
    font-weight:700;
    padding:2px 6px;
    border-radius:999px;
    background:rgba(76,175,125,0.15);
    color:var(--good);
    white-space:nowrap;
    flex-shrink:0;
  }
  .diff-chip-row{ display:flex; flex-wrap:wrap; gap:6px; flex:1 1 180px; min-width:140px; }
  .diff-chip{
    border:1px solid var(--border);
    background:#11141a;
    color:var(--text-dim);
    font-size:0.74rem;
    font-weight:700;
    padding:6px 10px;
    border-radius:999px;
    cursor:pointer;
  }
  .diff-chip:hover{ border-color:var(--accent); color:var(--text); }
  .diff-chip.active{ background:var(--difficulty); border-color:var(--difficulty); color:#10151c; box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--difficulty); }
  .diff-chip.disabled{ opacity:.4; cursor:not-allowed; }
  .diff-chip.disabled:hover{ border-color:var(--border); color:var(--text-dim); }

  .party-controls{
    display:flex;
    align-items:center;
    gap:5px;
    flex-shrink:0;
    visibility:hidden;
  }
  .boss-row.selected .party-controls{ visibility:visible; }
  .party-controls select, .party-controls input{
    font-weight:700;
    font-size:0.76rem;
    padding:5px 6px;
    border-radius:6px;
    border:1px solid var(--border);
    background:#11141a;
    color:var(--text);
  }
  .party-controls select{ cursor:pointer; }
  .party-controls input[type="number"]{
    width:48px;
    text-align:center;
    -moz-appearance:textfield;
  }
  .party-controls input[type="number"]::-webkit-outer-spin-button,
  .party-controls input[type="number"]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .party-controls select:focus, .party-controls input:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .row-preview{
    width:120px;
    flex-shrink:0;
    text-align:right;
    font-weight:700;
    color:var(--accent-strong);
    font-size:0.85rem;
  }

  @media (max-width:720px){
    .boss-name-wrap{ width:100%; }
    .row-preview{ width:auto; margin-left:auto; }
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:0.85rem;
    margin-top:14px;
  }
  th, td{
    text-align:left;
    padding:9px 8px;
    border-bottom:1px solid var(--border);
    vertical-align:middle;
  }
  th{
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--text-dim);
    font-weight:600;
  }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
  tr:last-child td{ border-bottom:none; }
  .meso{ color:var(--accent-strong); font-weight:700; }
  .name-cell{ display:flex; align-items:center; gap:8px; }
  .name-cell img, .name-cell .boss-icon-fallback{ width:24px; height:24px; border-radius:6px; }
  .diff-edit-select{
    font-weight:600;
    font-size:0.82rem;
    padding:6px 8px;
    border-radius:7px;
    border:1px solid var(--border);
    background:#11141a;
    color:var(--text);
    cursor:pointer;
  }
  .diff-edit-select:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  .badge{
    display:inline-block;
    font-size:0.68rem;
    font-weight:700;
    padding:2px 7px;
    border-radius:999px;
    background:rgba(76,141,255,.15);
    color:var(--accent-strong);
    margin-left:2px;
  }
  .badge.monthly{ background:rgba(76,175,125,0.15); color:var(--good); }
  .row-del{
    background:none;
    border:none;
    color:var(--text-dim);
    cursor:pointer;
    font-size:0.78rem;
    font-weight:700;
  }
  .row-del:hover{ color:var(--bad); }
  .table-wrap{ overflow-x:auto; }
  #bossTable .party-controls{ visibility:visible; justify-content:flex-end; }

  /* per-character summary card */
  .char-summary-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(150px, 1fr));
    gap:10px;
    margin-top:14px;
  }
  .char-summary-grid .summary-item .value{ font-size:1.1rem; }

  /* overall summary (top of page) */
  #overallTbody td.name{ font-weight:700; }

  .boss-toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:14px 0; }
  .tool-btn{ padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:var(--surface-2); color:var(--text); cursor:pointer; font:inherit; font-size:.8rem; }
  .tool-btn:hover{ border-color:var(--accent); }
  .tool-btn:disabled{ opacity:.45; cursor:default; }
  button:focus-visible, input:focus-visible, .char-chip:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }
  .summary-stat .v{ font-variant-numeric:tabular-nums; }
  .note:empty{ display:none; }
  .overall-card{ padding:28px; border-color:#3b5276; }
  .overall-card h2{ font-size:1.5rem; }
  .summary-inner{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin:24px 0; }
  .summary-stat{ display:flex; flex-direction:column; gap:10px; padding:22px; border-radius:12px; background:#111722; min-width:0; }
  .summary-stat:nth-child(3){ grid-area:1/1; }
  .summary-stat:nth-child(4){ grid-area:1/2; }
  .summary-stat .k{ font-size:.95rem; color:var(--text-dim); font-weight:600; }
  .summary-stat .v{ font-size:1.5rem; font-weight:800; color:var(--text); overflow-wrap:anywhere; }
  .summary-stat:nth-child(n+3) .v{ font-size:clamp(1.8rem,3.2vw,3rem); color:var(--accent); letter-spacing:-.04em; }
  #overallTable{ font-size:1rem; min-width:620px; }
  #overallTable td.name{ min-width:140px; overflow-wrap:anywhere; }
  #overallTable th{ font-size:.85rem; }
  #overallTable td{ padding:18px 12px; }
  #overallTable .meso{ font-size:1.25rem; }
  .character-heading{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .character-heading h2{ margin:0; font-size:1.35rem; }
  #charAddBtn{ min-height:54px; padding:14px 28px; font-size:1.1rem; font-weight:800; }
  .chip-bosses{ grid-column:1/-1; display:flex; flex-wrap:wrap; gap:8px; }
  .chip-boss{ position:relative; display:inline-flex; padding-bottom:8px; }
  .chip-boss img{ width:36px; height:36px; border-radius:8px; border:1px solid var(--border); object-fit:cover; }
  .difficulty-easy{ --difficulty:#80cc8f; }
  .difficulty-normal{ --difficulty:#77b9ef; }
  .difficulty-hard{ --difficulty:#f5a360; }
  .difficulty-chaos{ --difficulty:#eb88b8; }
  .difficulty-extreme{ --difficulty:#c6a1fa; }
  .difficulty-mark{ position:absolute; bottom:0; right:-3px; min-width:18px; padding:1px 4px; border-radius:4px; background:var(--difficulty); color:#111722; font-size:.65rem; line-height:1.3; text-align:center; font-weight:900; border:1px solid var(--card); }
  .diff-chip{ min-height:38px; min-width:68px; color:var(--difficulty); border-color:var(--difficulty); font-size:.76rem; font-weight:900; letter-spacing:.02em; }
  .boss-row{ padding:14px; }
  .boss-icon{ width:38px; height:38px; }
  .boss-name{ font-size:.95rem; }
  .boss-name-wrap{ width:195px; }
  .row-preview{ width:155px; font-size:1rem; }
  .boss-section-title{ padding:16px 14px; margin:0; font-size:1rem; border-bottom:1px solid var(--border); background:#111722; }
  .party-field{ display:flex; align-items:center; gap:5px; border:1px solid #52617a; border-radius:8px; padding:4px 9px; background:#11141a; }
  .party-field:focus-within{ outline:2px solid var(--accent); outline-offset:2px; }
  .party-controls .party-input{ width:38px; border:0; padding:5px 0; background:transparent; font-size:.95rem; text-align:center; }
  .party-controls .party-input:focus{ outline:none; }
  .party-picker-wrap{ position:relative; width:26px; height:30px; }
  .party-picker-wrap::after{ content:'▾'; position:absolute; inset:0; display:grid; place-items:center; color:var(--text); pointer-events:none; }
  .party-controls .party-picker{ position:absolute; inset:0; width:100%; height:100%; appearance:none; border:0; padding:0; background:transparent; color:transparent; cursor:pointer; }
  .party-controls .party-picker option{ color:var(--text); background:#171a21; }
  .party-controls .party-picker:focus{ outline:none; }
  .party-unit{ font-size:.85rem; color:var(--text-dim); }
  @media(min-width:1280px){
    .wrap{ max-width:1600px; }
    .dashboard-top{ display:grid; grid-template-columns:minmax(0,1.25fr) minmax(0,1fr); gap:20px; align-items:start; }
    .dashboard-top > .card{ min-width:0; }
    .dashboard-top .summary-stat{ padding:18px; }
    .dashboard-top .summary-stat:nth-child(n+3) .v{ font-size:clamp(1.7rem,2.3vw,2.3rem); }
    .dashboard-top .char-chip-list{ grid-template-columns:repeat(auto-fit,minmax(235px,1fr)); }
  }
  @media(max-width:720px){
    .overall-card{ padding:20px 16px; }
    .summary-inner{ gap:10px; }
    .summary-stat{ padding:16px 12px; }
    .summary-stat:nth-child(n+3){ grid-area:auto; grid-column:1/-1; }
    .summary-stat:nth-child(3){ order:-2; }
    .summary-stat:nth-child(4){ order:-1; }
    .summary-stat:nth-child(n+3) .v{ font-size:2rem; }
    .summary-stat .v{ font-size:1.3rem; }
    .char-chip-list{ grid-template-columns:minmax(0,1fr); }
    .boss-name-wrap{ width:100%; }
    .row-preview{ width:auto; }
  }
  @media(prefers-reduced-motion:reduce){ .boss-row{ transition:none; } }
</style>
</head>

<div class="wrap">
  <nav class="site-nav">

  <header>
    <h1>보스 수익 정산 계산기</h1>
  </header>

  <div class="dashboard-top">
  <section class="card overall-card">
    <h2>캐릭터 총합</h2>
<div class="overall-highlights">
  <div class="summary-inner">
    <div class="summary-stat">
      <span class="k">등록 캐릭터</span>
      <span class="v" id="sumCharCount">0명</span>
    </div>
    <div class="summary-stat meso">
      <span class="k">주간 결정 판매 수</span>
      <span class="v" id="sumCrystals">0개</span>
    </div>
    <div class="summary-stat meso">
      <span class="k">주간 수익</span>
      <span class="v" id="sumWeekly">0</span>
    </div>
    <div class="summary-stat meso">
      <span class="k">월간 수익 (4주 + 월간 보스)</span>
      <span class="v" id="sumMonthly">0</span>
    </div>
  </div>
</div>
    <p class="note" style="margin-top:0;" id="overallEmptyNote"></p>
    <div class="table-wrap">
      <table id="overallTable">
        <thead>
          <tr>
            <th>캐릭터</th>
            <th class="num">등록 보스</th>
            <th class="num">주간 수익</th>
            <th class="num">월간 수익</th>
          </tr>
        </thead>
        <tbody id="overallTbody"></tbody>
      </table>
    </div>
  </section>

  <section class="card">
    <div class="character-heading">
    <h2>내 캐릭터</h2>
    <div class="char-add-row">
      <button type="button" class="fetch-btn" id="charAddBtn">＋ 캐릭터 추가</button>
    </div>
    </div>
    <div class="char-chip-list" id="charChipList"></div>
    <div class="boss-toolbar">
      <button type="button" class="tool-btn" id="charCopyBtn">선택 캐릭터 복제</button>
    </div>
    <p class="note" id="actionNote" role="status" aria-live="polite"></p>
  </section>
  </div>

  <section class="card" id="bossPanel">
    <div class="boss-panel-head">
      <h2 id="bossPanelTitle">보스 체크</h2>
      <span class="weekly-quota" id="weeklyQuota"></span>
    </div>
    <p class="note" id="bossAddNote"></p>
    <div class="boss-toolbar">
      <button type="button" class="tool-btn" id="presetBtn">검밑솔 12보스 적용</button>
      <button type="button" class="tool-btn" id="clearBossBtn">선택 캐릭터 보스 초기화</button>
    </div>

    <div class="boss-list" id="bossList"></div>

    <div class="table-wrap">
      <table id="bossTable">
        <thead>
          <tr>
            <th>보스</th>
            <th>난이도</th>
            <th class="num">전체 보상</th>
            <th class="num">N빵 인원</th>
            <th class="num">1인당 수익</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="bossTbody"></tbody>
      </table>
    </div>

    <div class="char-summary-grid">
      <div class="summary-item">
        <div class="label">주간 수익 (1주일)</div>
        <div class="value meso" id="charWeekly">0</div>
      </div>
      <div class="summary-item">
        <div class="label">월간 수익 (주간×4 + 월간 보스)</div>
        <div class="value meso" id="charMonthly">0</div>
      </div>
    </div>
  </section>
</div>

      { label:"노멀", price:22000000 }
    ]},
    { name:"루시드", icon:"icons/boss/lucid.webp", diffs:[
      { label:"하드", price:59700000 },
      { label:"노멀", price:17800000 },
      { label:"이지", price:14900000 }
    ]},
    { name:"데미안", icon:"icons/boss/damien.webp", diffs:[
      { label:"하드", price:46400000 },
      { label:"노멀", price:8750000 }
    ]},
    { name:"파풀라투스", icon:"icons/boss/papulatus.webp", diffs:[
      { label:"카오스", price:6550000 }
    ]},
    { name:"벨룸", icon:"icons/boss/vellum.webp", diffs:[
      { label:"카오스", price:4640000 }
    ]},
    { name:"매그너스", icon:"icons/boss/magnus.webp", diffs:[
      { label:"하드", price:4280000 }
    ]},
    { name:"피에르", icon:"icons/boss/pierre.webp", diffs:[
      { label:"카오스", price:4080000 }
    ]},
    { name:"반반", icon:"icons/boss/banban.webp", diffs:[
      { label:"카오스", price:4070000 }
    ]},
    { name:"블러디 퀸", icon:"icons/boss/bloody_queen.webp", diffs:[
      { label:"카오스", price:4070000 }
    ]},
    { name:"자쿰", icon:"icons/boss/zakum.webp", diffs:[
      { label:"카오스", price:4040000 }
    ]}
  ];
  // 보스 이름으로 바로 찾을 수 있는 조회용 맵. 저장 데이터는 보스 "이름"을 키로 쓰므로
  // 정렬 순서나 가격이 바뀌어도(예: 보상 개편, 순서 재정렬) 저장된 캐릭터의 체크 상태가
  // 깨지지 않는다. idx는 renderBossTable에서 BOSS_DATA 순서대로 정렬할 때만 쓴다.
  var BOSS_BY_NAME = Object.create(null);
  BOSS_DATA.forEach(function(b, i){ b.idx = i; BOSS_BY_NAME[b.name] = b; });
  // 표시 순서만 변경한다. 저장된 bossIdx/diffIdx의 의미는 유지한다.
  var BOSS_DISPLAY_ORDER = [
    '자쿰','매그너스','피에르','반반','블러디 퀸','벨룸','파풀라투스',
    '스우','데미안','가디언 엔젤 슬라임','루시드','윌','더스크','진 힐라','듄켈',
    '선택받은 세렌','감시자 칼로스','최초의 대적자','카링','찬란한 흉성','벨로나','림보','발드릭스','유피테르','검은 마법사'
  ];
  var DISPLAY_BOSSES = BOSS_DISPLAY_ORDER.map(function(name){ return BOSS_BY_NAME[name]; });
  var DIFFICULTY = {
    '이지':{key:'easy', text:'EASY', mark:'E', rank:0},
    '노멀':{key:'normal', text:'NORMAL', mark:'N', rank:1},
    '하드':{key:'hard', text:'HARD', mark:'H', rank:2},
    '카오스':{key:'chaos', text:'CHAOS', mark:'C', rank:3},
    '익스트림':{key:'extreme', text:'EXTREME', mark:'EX', rank:4}
  };
  function orderedDiffs(boss){
    return boss.diffs.map(function(d, i){ return {diff:d, index:i}; }).sort(function(a,b){
      return DIFFICULTY[a.diff.label].rank - DIFFICULTY[b.diff.label].rank;
    });
  }

  var WEEKLY_CAP = 12;
  var WEEKS_PER_MONTH = 4;

  var LS_KEY = 'boss_income_state';
  function lsGet(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
  function lsSet(k, v){
    try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }
  function validParty(value){
    var n = Number(value);
    return Number.isFinite(n) ? Math.min(99, Math.max(1, Math.round(n))) : 1;
  }
  function escapeHtml(value){
    return String(value).replace(/[&<>"']/g, function(c){ return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]; });
  }

  // characters: [{ name, bosses: { [bossName]: { diffIdx, party } } }]
  // bosses is a map keyed by boss name — a boss can only be cleared at one
  // difficulty per week, so checking a new difficulty simply overwrites it.
  function normalizeCharacter(raw){
    var bosses = Object.create(null);
    if (raw && raw.bosses){
      if (Array.isArray(raw.bosses)){
        // 아주 예전 버전(드롭다운 방식)의 배열 데이터 호환: 같은 보스가 여러 번 있으면 마지막 것만 사용
        raw.bosses.forEach(function(e){
          var boss = e && BOSS_DATA[e.bossIdx];
          if (boss && Number.isInteger(e.diffIdx) && boss.diffs[e.diffIdx]) bosses[boss.name] = { diffIdx: e.diffIdx, party: validParty(e.party) };
        });
      } else {
        Object.keys(raw.bosses).forEach(function(k){
          var e = raw.bosses[k];
          // k가 숫자 인덱스였던 이전 버전 데이터는 보스 순서가 바뀌면 더 이상 신뢰할 수
          // 없어 건너뛴다. 이름 키인 경우에만 복원한다.
          var boss = BOSS_BY_NAME[k];
          if (e && boss && Number.isInteger(e.diffIdx) && boss.diffs[e.diffIdx]) bosses[k] = { diffIdx: e.diffIdx, party: validParty(e.party) };
        });
      }
    }
    // 저장 데이터도 주간 한도를 검증하고, 초과 시 1인 수익이 높은 12개를 남긴다.
    Object.keys(bosses).filter(function(k){ return !BOSS_BY_NAME[k].monthly; }).sort(function(a,b){
      return BOSS_BY_NAME[b].diffs[bosses[b].diffIdx].price / bosses[b].party - BOSS_BY_NAME[a].diffs[bosses[a].diffIdx].price / bosses[a].party;
    }).slice(WEEKLY_CAP).forEach(function(k){ delete bosses[k]; });
    return { name: raw && typeof raw.name === 'string' ? raw.name.trim().slice(0,20) || '캐릭터' : '캐릭터', bosses: bosses };
  }

  function loadState(){
    try {
      var raw = lsGet(LS_KEY);
      if (!raw) return null;
      var parsed = JSON.parse(raw);
      if (!parsed || !Array.isArray(parsed.characters)) return null;
      return parsed.characters.map(normalizeCharacter);
    } catch(e){ return null; }
  }
  function saveState(){
    var saved = lsSet(LS_KEY, JSON.stringify({ characters: characters }));
    document.getElementById('actionNote').textContent = saved ? '' : '자동 저장이 차단되었습니다. 이 화면을 닫으면 변경 내용이 사라질 수 있어요.';
  }

  var characters = loadState() || [];
  var activeIdx = characters.length ? 0 : -1;

  function won(n){
    n = Math.floor(n);
    if (n < 10000) return n.toLocaleString('ko-KR');
    var eok = Math.floor(n / 100000000), man = Math.floor(n % 100000000 / 10000), rest = n % 10000;
    return ((eok ? eok.toLocaleString('ko-KR') + '억 ' : '') + (man ? man.toLocaleString('ko-KR') + '만 ' : '') + (rest ? rest.toLocaleString('ko-KR') : '')).trim();
  }

  function iconHtml(boss, cls){
    if (boss.icon) return '<img class="' + cls + '" src="' + boss.icon + '" alt="" loading="lazy">';
    var initial = boss.name.slice(0, 1);
    return '<span class="boss-icon-fallback">' + initial + '</span>';
  }

  // 하나의 입력칸에서 1~6인 목록 선택과 직접 입력을 함께 지원한다.
  function partyControlsHtml(bossIdx, party){
    var options = '<option value="" disabled' + (party > 6 ? ' selected' : '') + '>인원 선택</option>';
    for (var n = 1; n <= 6; n++) options += '<option value="' + n + '"' + (party === n ? ' selected' : '') + '>' + n + '인</option>';
    return '<div class="party-controls">' +
      '<div class="party-field"><input type="text" inputmode="numeric" autocomplete="off" class="party-input" aria-label="' + bossIdx + ' 파티 인원" value="' + party + '" data-party-boss="' + bossIdx + '">' +
      '<span class="party-unit" aria-hidden="true">인</span><span class="party-picker-wrap"><select class="party-picker" aria-label="' + bossIdx + ' 인원 목록">' + options + '</select></span></div>' +
    '</div>';
  }
  function bindPartyControls(root){
    root.querySelectorAll('.party-input[data-party-boss]').forEach(function(inp){
      inp.addEventListener('click', function(e){ e.stopPropagation(); });
      inp.addEventListener('focus', function(){ inp.select(); });
      function commitParty(){
        var v = validParty(inp.value);
        inp.value = String(v);
        setParty(inp.getAttribute('data-party-boss'), v);
      }
      inp.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ commitParty(); inp.blur(); } });
      var field = inp.closest('.party-field');
      var picker = field.querySelector('.party-picker');
      picker.addEventListener('change', function(){
        inp.value = picker.value;
        commitParty();
      });
      field.addEventListener('focusout', function(e){
        if (!field.contains(e.relatedTarget)) commitParty();
      });
    });
  }
  function setParty(bossIdx, party){
    var entry = characters[activeIdx].bosses[bossIdx];
    if (!entry || entry.party === validParty(party)) return;

    entry.party = validParty(party);
    saveState();
    renderAll();
  }

  function weeklyCount(ch){
    var n = 0;
    Object.keys(ch.bosses).forEach(function(idx){
      if (!BOSS_BY_NAME[idx].monthly) n++;
    });
    return n;
  }

  function charTotals(ch){
    var weeklyMeso = 0, monthlyOnlyMeso = 0, count = 0;
    Object.keys(ch.bosses).forEach(function(idx){
      var boss = BOSS_BY_NAME[idx];
      var entry = ch.bosses[idx];
      var diff = boss.diffs[entry.diffIdx];
      var per = Math.floor(diff.price / validParty(entry.party));
      count++;
      if (boss.monthly) monthlyOnlyMeso += per;
      else weeklyMeso += per;
    });
    var monthlyMeso = weeklyMeso * WEEKS_PER_MONTH + monthlyOnlyMeso;
    return { weeklyMeso: weeklyMeso, monthlyMeso: monthlyMeso, weeklyCount: weeklyCount(ch), totalCount: count };
  }

  function nextAutoName(){
    var n = 1;
    while (characters.some(function(c){ return c.name === '캐릭터' + n; })) n++;
    return '캐릭터' + n;
  }

  // ---------- Character chips ----------
  var charAddBtn = document.getElementById('charAddBtn');
  var charChipList = document.getElementById('charChipList');
  var bossPanel = document.getElementById('bossPanel');
  var bossPanelTitle = document.getElementById('bossPanelTitle');

  charAddBtn.addEventListener('click', function(){
    var name = nextAutoName();

    characters.push({ name: name, bosses: {} });
    activeIdx = characters.length - 1;
    saveState();
    renderAll();
  });

  function renderCharChips(){
    charChipList.innerHTML = '';
    characters.forEach(function(ch, idx){
      var t = charTotals(ch);
      var chip = document.createElement('div');
      chip.className = 'char-chip' + (idx === activeIdx ? ' active' : '');
      chip.tabIndex = 0;
      chip.setAttribute('role', 'group');
      chip.setAttribute('aria-label', ch.name + ' 선택' + (idx === activeIdx ? ' (선택됨)' : ''));
      chip.addEventListener('keydown', function(e){
        if (e.target === chip && (e.key === 'Enter' || e.key === ' ')){
          e.preventDefault(); activeIdx = idx; renderAll();
        }
      });
      chip.innerHTML =
        '<input class="chip-name" type="text" maxlength="20" aria-label="캐릭터 이름 수정" placeholder="캐릭터 이름" autocomplete="off" spellcheck="false" value="' + escapeHtml(ch.name) + '">' +
        '<button type="button" class="chip-del" aria-label="' + escapeHtml(ch.name) + ' 삭제">×</button>' +
        '<span class="chip-meso">주 ' + won(t.weeklyMeso) + '</span>' +
        '<span class="chip-bosses">' + DISPLAY_BOSSES.filter(function(b){ return ch.bosses[b.name]; }).map(function(b){
          var difficulty = b.diffs[ch.bosses[b.name].diffIdx].label;
          var badge = DIFFICULTY[difficulty];
          return '<span class="chip-boss difficulty-' + badge.key + '" role="img" aria-label="' + b.name + ' ' + difficulty + '" title="' + b.name + ' · ' + difficulty + '">' +
            iconHtml(b, 'chip-boss-icon') + '<span class="difficulty-mark" aria-hidden="true">' + badge.mark + '</span></span>';
        }).join('') + '</span>';
      chip.addEventListener('click', function(e){
        if (e.target.closest('.chip-del') || e.target.closest('.chip-name')) return;
        activeIdx = idx;
        renderAll();
      });
      var nameEl = chip.querySelector('.chip-name');
      nameEl.addEventListener('click', function(e){
        e.stopPropagation();
        if (activeIdx === idx) return;
        activeIdx = idx;
        // 편집 중인 입력칸의 포커스가 날아가지 않도록 칩 목록 전체를
        // 다시 그리지 않고, 활성 표시만 갱신하고 보스 패널만 다시 그린다.
        charChipList.querySelectorAll('.char-chip').forEach(function(c, i){ c.classList.toggle('active', i === idx); });
        renderBossPanel();
      });
      nameEl.addEventListener('keydown', function(e){
        if (e.key === 'Enter' && !e.isComposing){ e.preventDefault(); nameEl.blur(); }
      });
      nameEl.addEventListener('blur', function(){
        var newName = nameEl.value.trim().slice(0,20);
        if (!newName){ newName = ch.name; }
        if (newName !== ch.name && characters.some(function(c){ return c.name === newName; })){
          newName = ch.name; // 중복이면 원래 이름 유지
        }
        if (newName === ch.name){ nameEl.value = ch.name; return; }

        ch.name = newName;
        saveState();
        renderAll();
      });
      chip.querySelector('.chip-del').addEventListener('click', function(){

        characters.splice(idx, 1);
        if (idx < activeIdx) activeIdx--;
        else if (activeIdx >= characters.length) activeIdx = characters.length - 1;
        saveState();
        renderAll();
      });
      charChipList.appendChild(chip);
    });
    if (!characters.length){
      var empty = document.createElement('div');
      empty.className = 'empty-note';
      empty.textContent = '등록된 캐릭터가 없습니다. 캐릭터를 먼저 추가하세요.';
      charChipList.appendChild(empty);
    }
  }

  // ---------- Boss list ----------
  var bossAddNote = document.getElementById('bossAddNote');
  var weeklyQuota = document.getElementById('weeklyQuota');
  var bossList = document.getElementById('bossList');
  var bossTbody = document.getElementById('bossTbody');
  var charWeeklyEl = document.getElementById('charWeekly');
  var charMonthlyEl = document.getElementById('charMonthly');

  function toggleDiff(ch, bossIdx, diffIdx){
    var boss = BOSS_BY_NAME[bossIdx];
    var existing = ch.bosses[bossIdx];
    if (existing && existing.diffIdx === diffIdx){

      delete ch.bosses[bossIdx];
      bossAddNote.textContent = '';
      saveState();
      renderAll();
      return;
    }
    if (!boss.monthly && !existing && weeklyCount(ch) >= WEEKLY_CAP){
      bossAddNote.textContent = '주간 보스는 캐릭터당 최대 ' + WEEKLY_CAP + '마리까지만 체크할 수 있습니다.';
      bossAddNote.className = 'note fetch-status err';
      return;
    }

    ch.bosses[bossIdx] = { diffIdx: diffIdx, party: existing ? existing.party : 1 };
    bossAddNote.textContent = '';
    saveState();
    renderAll();
  }

  function renderBossList(){
    var ch = characters[activeIdx];
    var atCap = weeklyCount(ch) >= WEEKLY_CAP;
    bossList.innerHTML = '';
    DISPLAY_BOSSES.forEach(function(boss, position){
      if (position === 0 || boss.monthly){
        var heading = document.createElement('h3');
        heading.className = 'boss-section-title';
        heading.textContent = boss.monthly ? '월간 보스' : '주간 보스';
        bossList.appendChild(heading);
      }
      var bossIdx = boss.name;
      var entry = ch.bosses[bossIdx];
      var row = document.createElement('div');
      row.className = 'boss-row' + (entry ? ' selected' : '');

      var chipsHtml = orderedDiffs(boss).map(function(item){
        var d = item.diff, diffIdx = item.index;
        var isActive = entry && entry.diffIdx === diffIdx;
        var isDisabled = !isActive && !boss.monthly && !entry && atCap;
        return '<button type="button" class="diff-chip difficulty-' + DIFFICULTY[d.label].key + (isActive ? ' active' : '') + (isDisabled ? ' disabled' : '') +
          '" title="' + d.label + '" aria-label="' + boss.name + ' ' + d.label + '" aria-pressed="' + !!isActive + '" aria-disabled="' + !!isDisabled + '" data-boss="' + bossIdx + '" data-diff="' + diffIdx + '">' + DIFFICULTY[d.label].text + '</button>';
      }).join('');

      var party = entry ? entry.party : 1;
      var price = entry ? boss.diffs[entry.diffIdx].price : 0;
      var per = entry ? Math.floor(price / validParty(party)) : 0;

      row.innerHTML =
        '<div class="boss-name-wrap">' +
          iconHtml(boss, 'boss-icon') +
          '<span class="boss-name">' + boss.name + '</span>' +
          (boss.monthly ? '<span class="boss-check-badge">월간</span>' : '') +
        '</div>' +
        '<div class="diff-chip-row">' + chipsHtml + '</div>' +
        partyControlsHtml(bossIdx, party) +
        '<span class="row-preview">' + (entry ? won(per) : '') + '</span>';
      bossList.appendChild(row);
    });

    bossList.querySelectorAll('.diff-chip').forEach(function(btn){
      if (btn.classList.contains('disabled')){
        btn.addEventListener('click', function(){
          bossAddNote.textContent = '주간 보스는 캐릭터당 최대 ' + WEEKLY_CAP + '마리까지만 체크할 수 있습니다.';
          bossAddNote.className = 'note fetch-status err';
        });
        return;
      }
      btn.addEventListener('click', function(){
        toggleDiff(characters[activeIdx], btn.getAttribute('data-boss'), +btn.getAttribute('data-diff'));
      });
    });
    bindPartyControls(bossList);
  }

  function renderBossTable(){
    bossTbody.innerHTML = '';
    var ch = characters[activeIdx];
    Object.keys(ch.bosses).sort(function(a,b){ return BOSS_DISPLAY_ORDER.indexOf(a) - BOSS_DISPLAY_ORDER.indexOf(b); }).forEach(function(bossIdx){
      var boss = BOSS_BY_NAME[bossIdx];
      var entry = ch.bosses[bossIdx];
      var diff = boss.diffs[entry.diffIdx];
      var price = diff.price;
      var per = Math.floor(price / validParty(entry.party));
      var diffOptions = orderedDiffs(boss).map(function(item){
        var d = item.diff, i = item.index;
        return '<option value="' + i + '"' + (i === entry.diffIdx ? ' selected' : '') + '>' + d.label + '</option>';
      }).join('');
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td><div class="name-cell">' + iconHtml(boss, 'boss-icon') + '<span>' + boss.name + (boss.monthly ? '<span class="badge monthly">월간</span>' : '<span class="badge">주간</span>') + '</span></div></td>' +
        '<td><select class="diff-edit-select" aria-label="' + bossIdx + ' 난이도" data-diff-boss="' + bossIdx + '">' + diffOptions + '</select></td>' +
        '<td class="num">' + won(price) + '</td>' +
        '<td class="num">' + partyControlsHtml(bossIdx, entry.party) + '</td>' +
        '<td class="num meso">' + won(per) + '</td>' +
        '<td><button type="button" class="row-del" data-boss="' + bossIdx + '">삭제</button></td>';
      bossTbody.appendChild(tr);
    });
    bossTbody.querySelectorAll('.row-del').forEach(function(btn){
      btn.addEventListener('click', function(){

        delete characters[activeIdx].bosses[btn.getAttribute('data-boss')];
        saveState();
        renderAll();
      });
    });
    bossTbody.querySelectorAll('.diff-edit-select[data-diff-boss]').forEach(function(sel){
      sel.addEventListener('change', function(){
        var bossIdx = sel.getAttribute('data-diff-boss');
        var entry = characters[activeIdx].bosses[bossIdx];
        if (!entry) return;

        entry.diffIdx = +sel.value;
        saveState();
        renderAll();
      });
    });
    bindPartyControls(bossTbody);
  }

  function renderBossPanel(){
    var has = activeIdx >= 0;
    bossPanel.classList.toggle('hidden', !has);
    if (!has) return;
    var ch = characters[activeIdx];
    bossPanelTitle.textContent = ch.name + ' — 보스 체크';
    var wc = weeklyCount(ch);
    weeklyQuota.textContent = '주간 ' + wc + ' / ' + WEEKLY_CAP + '마리';
    weeklyQuota.className = 'weekly-quota' + (wc >= WEEKLY_CAP ? ' warn' : '');
    renderBossList();
    renderBossTable();
    var t = charTotals(ch);
    charWeeklyEl.textContent = won(t.weeklyMeso);
    charMonthlyEl.textContent = won(t.monthlyMeso);
  }

  // ---------- Overall summary ----------
  var overallTbody = document.getElementById('overallTbody');
  var overallEmptyNote = document.getElementById('overallEmptyNote');
  var sumCharCount = document.getElementById('sumCharCount');
  var sumWeekly = document.getElementById('sumWeekly');
  var sumMonthly = document.getElementById('sumMonthly');

  function renderOverall(){
    overallTbody.innerHTML = '';
    overallEmptyNote.textContent = characters.length ? '' : '등록된 캐릭터가 없습니다.';
    var totalWeekly = 0, totalMonthly = 0, totalCrystals = 0;
    characters.forEach(function(ch){
      var t = charTotals(ch);
      totalWeekly += t.weeklyMeso;
      totalMonthly += t.monthlyMeso;
      totalCrystals += t.weeklyCount;
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="name">' + escapeHtml(ch.name) + '</td>' +
        '<td class="num">' + t.totalCount + '마리</td>' +
        '<td class="num meso">' + won(t.weeklyMeso) + '</td>' +
        '<td class="num meso">' + won(t.monthlyMeso) + '</td>';
      overallTbody.appendChild(tr);
    });
    sumCharCount.textContent = characters.length + '명';
    sumWeekly.textContent = won(totalWeekly);
    sumMonthly.textContent = won(totalMonthly);
    document.getElementById('sumCrystals').textContent = totalCrystals + '개';
  }

  function renderAll(){
    document.getElementById('charCopyBtn').disabled = activeIdx < 0;
    renderCharChips();
    renderBossPanel();
    renderOverall();
  }

  document.getElementById('charCopyBtn').addEventListener('click', function(){
    if (activeIdx < 0) return;

    var copy = JSON.parse(JSON.stringify(characters[activeIdx]));
    var base = copy.name.slice(0,12), n = 1;
    do { copy.name = base + ' 복사' + n++; } while (characters.some(function(ch){ return ch.name === copy.name; }));
    characters.push(copy); activeIdx = characters.length - 1;
    saveState(); renderAll();
  });
  document.getElementById('clearBossBtn').addEventListener('click', function(){
    if (activeIdx < 0 || !Object.keys(characters[activeIdx].bosses).length) return;
    characters[activeIdx].bosses = {};
    bossAddNote.textContent = '';
    saveState(); renderAll();
  });
  var BLACK_MAGE_BELOW_PRESET = {
    '매그너스':'하드', '파풀라투스':'카오스', '블러디 퀸':'카오스', '벨룸':'카오스',
    '스우':'하드', '데미안':'하드', '가디언 엔젤 슬라임':'카오스', '루시드':'하드',
    '윌':'하드', '더스크':'카오스', '진 힐라':'하드', '듄켈':'하드'
  };
  function applyPreset(ch){
    Object.keys(ch.bosses).forEach(function(name){ if (!BOSS_BY_NAME[name].monthly) delete ch.bosses[name]; });
    Object.keys(BLACK_MAGE_BELOW_PRESET).forEach(function(name){
      ch.bosses[name] = { diffIdx:BOSS_BY_NAME[name].diffs.findIndex(function(d){ return d.label === BLACK_MAGE_BELOW_PRESET[name]; }), party:1 };
    });
  }
  document.getElementById('presetBtn').addEventListener('click', function(){
    if (activeIdx < 0) return;
    applyPreset(characters[activeIdx]);
    bossAddNote.textContent = '';
    saveState(); renderAll();
  });

  renderAll();
})();
</script>
</body>
</html>
