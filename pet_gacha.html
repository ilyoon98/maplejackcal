    {id:'normal',name:'일반',type:'normal',rarity:'꽝 · 합성 불가',prob:30.04,emoji:'⚪'}
  ];
  const SYNTH = {sweet:[{id:'luna-sweet',name:'루나 스윗',type:'sweet',rarity:'중간 재료',prob:86.4,emoji:'S'},{id:'luna-petit',name:'루나 쁘띠',type:'petit',rarity:'당첨',prob:11.64,emoji:'P'},{id:'crystal',name:'크리스탈',type:'crystal',rarity:'재사용 불가',prob:1.96,emoji:'✦'}],dream:[{id:'luna-petit',name:'루나 쁘띠',type:'petit',rarity:'당첨',prob:20.4,emoji:'P'},{id:'luna-dream',name:'루나 드림',type:'dream',rarity:'꽝 · 사용 불가',prob:75.6,emoji:'D'},{id:'crystal',name:'크리스탈',type:'crystal',rarity:'재사용 불가',prob:4,emoji:'✦'}]};
  const ALL_ITEMS=[...new Map([...WISPS,SYNTH.sweet[0],SYNTH.sweet[1],SYNTH.dream[1],SYNTH.sweet[2]].map(x=>[x.id,x])).values()];
  const state={inv:Object.fromEntries(ALL_ITEMS.map(x=>[x.id,0])),selected:[],spent:0,synthAnimating:false,pulls:0,synths:0,petResults:0,sessionBlack:0,sessionDream:0,sessionPetit:0,synthPetitProbs:[],last:null,lastBatch:[],log:[]};
  const $=id=>document.getElementById(id); const money=n=>n.toLocaleString('ko-KR')+'원';
  function pick(list){const r=Math.random()*100;let sum=0;for(const x of list){sum+=x.prob;if(r<sum)return x;}return list[list.length-1];}
  function itemById(id){return ALL_ITEMS.find(x=>x.id===id)}
  function addLog(item,kind,cost){state.log.unshift({item,kind,cost});state.log=state.log.slice(0,16)}
  function flashResult(){const card=$('resultCard');card.classList.remove('result-arrive');void card.offsetWidth;card.classList.add('result-arrive');}
  function pull(){const item=pick(WISPS);state.inv[item.id]++;state.pulls++;if(item.type==='black')state.sessionBlack++;state.last={...item,source:'원더베리'};state.lastBatch=[state.last];addLog(item,'원더베리',0);render();flashResult();return item;}
  function pullMany(){const batch=[];for(let i=0;i<11;i++)batch.push({...pull(),source:'원더베리'});state.lastBatch=batch;state.spent+=54000;render();}
  function select(id){const it=itemById(id);if(!it||!['black','sweet'].includes(it.type)||!state.inv[id])return;if(state.selected.length>=2)return;state.inv[id]--;state.selected.push(id);render();}
  function clearSelected(){for(const id of state.selected)state.inv[id]++;state.selected=[];render();}
  function synth(){if(state.selected.length!==2)return;const a=itemById(state.selected[0]),b=itemById(state.selected[1]);if(!a||!b)return;const canSweet=a.type==='black'&&b.type==='black';const canDream=(a.type==='black'&&b.type==='sweet')||(a.type==='sweet'&&b.type==='black');if(!canSweet&&!canDream){clearSelected();return;}const mode=canSweet?'sweet':'dream';const petitProb=mode==='sweet'?0.1164:0.204;const result=pick(SYNTH[mode]);const synthItem={...result,source:mode==='sweet'?'루나 크리스탈 스윗':'루나 크리스탈 드림'};state.synths++;state.synthPetitProbs.push(petitProb);state.inv[result.id]++;if(result.type==='petit'){state.petResults++;state.sessionPetit++;}if(result.type==='dream')state.sessionDream++;state.spent+=3900;state.last=synthItem;state.lastBatch=[synthItem];state.selected=[];render();flashResult();}
  function topPercent(item){if(!item)return '-';return '상위 '+item.prob.toFixed(item.prob<5?3:2)+'% 확률';}
  const LOG_FACT=[0,0];
  function logFactorial(n){for(let i=LOG_FACT.length;i<=n;i++)LOG_FACT[i]=LOG_FACT[i-1]+Math.log(i);return LOG_FACT[n];}
  function binomialTail(n,k,p){if(!n||!k)return null;if(k>n)return 0;const logP=Math.log(p),logQ=Math.log1p(-p);let sum=0;for(let i=k;i<=n;i++)sum+=Math.exp(logFactorial(n)-logFactorial(i)-logFactorial(n-i)+i*logP+(n-i)*logQ);return Math.min(1,sum);}
  function poissonBinomialTail(probs,k){if(!probs.length||!k)return null;const dp=[1];for(const rawP of probs){const p=Number(rawP);if(!Number.isFinite(p))continue;const next=Array(dp.length+1).fill(0);for(let i=0;i<dp.length;i++){next[i]+=(dp[i]||0)*(1-p);next[i+1]+=(dp[i]||0)*p;}dp.splice(0,dp.length,...next);}return dp.slice(k).reduce((a,b)=>a+b,0);}
  function luckLabel(prob){return !Number.isFinite(prob)?'-':'상위 '+(prob*100).toFixed(prob<0.01?3:2)+'%';}
  function tone(type){return type==='petit'?'batch-jackpot':type==='black'?'batch-wonder':type==='sweet'?'batch-mid':type==='dream'?'batch-dud':'';}
  function renderInventory(){const el=$('inventory');el.innerHTML='';const order=['luna-petit','luna-sweet','wonder-black','upper','normal','luna-dream','crystal'];const important=['luna-petit','luna-sweet','wonder-black'];const junk=['upper','normal','crystal'];ALL_ITEMS.slice().sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id)).forEach(it=>{const usable=['black','sweet'].includes(it.type);const btn=document.createElement(usable?'button':'div');btn.className='inv-item material-'+it.id+(important.includes(it.id)?' important-material':'')+(junk.includes(it.id)?' junk-material':'')+(state.selected.includes(it.id)?' selected':'');if(usable)btn.disabled=!state.inv[it.id];btn.innerHTML='<div class="inv-head"><span class="pet-mark">'+it.emoji+'</span><span class="inv-main"><span class="inv-name">'+it.name+'</span><span class="inv-count">'+state.inv[it.id]+'개</span></span></div><span class="inv-type">'+it.rarity+(it.prob?' · '+it.prob+'%':'')+'</span>';if(usable)btn.onclick=()=>select(it.id);el.appendChild(btn);});}
  function renderSlot(id,index){const el=$(id),sel=state.selected[index];if(sel){const it=itemById(sel);el.className='slot filled';el.innerHTML='<b>'+it.emoji+' '+it.name+'</b>';}else{el.className='slot';el.innerHTML='재료 '+(index+1)+'<br>클릭해서 넣기';}}
  function render(){renderInventory();renderSlot('slotA',0);renderSlot('slotB',1);$('synthBtn').disabled=state.selected.length!==2;$('spent').textContent=money(state.spent);$('pullCount').textContent=state.pulls+'개';$('synthCount').textContent=state.synths+'회';$('blackCount').textContent=state.sessionBlack+'개';$('petitCount').textContent=state.sessionPetit+'개';$('dreamCount').textContent=state.sessionDream+'개';$('blackLuckCount').textContent=state.sessionBlack+'개';$('petitLuckCount').textContent=state.sessionPetit+'개';$('blackLuck').textContent=luckLabel(binomialTail(state.pulls,state.sessionBlack,0.11952));$('petitLuck').textContent=state.sessionPetit?luckLabel(poissonBinomialTail(state.synthPetitProbs,state.sessionPetit)):'쁘띠 없음';const main=$('resultMain');main.classList.remove('result-wonder','result-mid','result-jackpot','result-dud');if(state.last){$('resultEmpty').classList.add('hidden');const highlights=state.lastBatch.filter(x=>['black','sweet','petit','dream'].includes(x.type));const strongest=highlights.find(x=>x.type==='petit')||highlights.find(x=>x.type==='black')||highlights.find(x=>x.type==='sweet')||highlights.find(x=>x.type==='dream');if(strongest)main.classList.add(tone(strongest.type));if(state.lastBatch.length>1){$('resultMain').classList.add('hidden');$('resultBatch').classList.remove('hidden');$('resultBatch').innerHTML=state.lastBatch.map(x=>'<div class="result-batch-item '+tone(x.type)+'" title="'+x.name+'"><div class="result-batch-icon">'+x.emoji+'</div><div class="result-batch-label">'+x.name+'</div></div>').join('');$('topPercent').textContent='11개 결과';}else{$('resultBatch').classList.add('hidden');$('resultMain').classList.remove('hidden');$('resultEmoji').textContent=state.last.emoji;$('resultName').textContent=state.last.name;$('resultRarity').textContent=state.last.rarity;$('resultDetail').textContent=state.last.source;$('topPercent').textContent=topPercent(state.last);}}else{$('topPercent').textContent='-'}const logEl=$('log');if(logEl)logEl.innerHTML=state.log.length?state.log.map(x=>'<li><span class="log-icon">'+x.item.emoji+'</span><span class="log-copy"><b>'+x.item.name+'</b><small>'+x.kind+(x.cost?' · '+money(x.cost):'')+'</span></li>').join(''):'<li class="muted">아직 결과가 없습니다. 원더베리를 열어보세요.</li>';}
  function quickSynthesize(ids,button){const required=ids.reduce((counts,id)=>(counts[id]=(counts[id]||0)+1,counts),{});const missing=Object.entries(required).some(([id,count])=>state.inv[id]<count);if(state.synthAnimating||state.selected.length){return;}if(missing){$('synthError').textContent='재료가 부족합니다. 보관함에서 재료를 확인해주세요.';return;}$('synthError').textContent='';ids.forEach(id=>{state.inv[id]--;state.selected.push(id)});state.synthAnimating=true;button.classList.add('is-activating');render();$('synthBox').classList.add('synth-draw');$('slotA').classList.add('slot-enter');$('slotB').classList.add('slot-enter');setTimeout(()=>{button.classList.remove('is-activating');$('synthBox').classList.remove('synth-draw');$('slotA').classList.remove('slot-enter');$('slotB').classList.remove('slot-enter');synth();state.synthAnimating=false;render();},520);}
  const auto={running:false,timer:null,steps:0,startPetit:0};
  const AUTO_DELAY=140;
  const MAX_AUTO_STEPS=4000;
  function autoGained(){return state.sessionPetit-auto.startPetit;}
  function autoSynth(ids){ids.forEach(id=>{state.inv[id]--;state.selected.push(id)});synth();}
  function stopAuto(){auto.running=false;if(auto.timer){clearTimeout(auto.timer);auto.timer=null;}$('autoCard').classList.remove('is-running');$('autoStart').disabled=false;render();}
  function autoStep(){
    if(!auto.running)return;
    if(autoGained()>=1){stopAuto();return;}
    if(auto.steps>=MAX_AUTO_STEPS){stopAuto();return;}
    const hasPair=state.inv['wonder-black']>=1&&state.inv['luna-sweet']>=1;
    const hasBlacks=state.inv['wonder-black']>=2;
    if(hasPair)autoSynth(['wonder-black','luna-sweet']);
    else if(hasBlacks)autoSynth(['wonder-black','wonder-black']);
    else pullMany();
    auto.steps++;
    auto.timer=setTimeout(autoStep,AUTO_DELAY);
  }
  function startAuto(){
    if(auto.running||state.synthAnimating)return;
    if(state.selected.length)clearSelected();
    auto.steps=0;auto.startPetit=state.sessionPetit;auto.running=true;
    $('autoCard').classList.add('is-running');$('autoStart').disabled=true;$('synthError').textContent='';
    autoStep();
  }
  $('pullOne').onclick=()=>{state.spent+=5400;pull()};$('pullEleven').onclick=pullMany;$('quickBlack').onclick=()=>quickSynthesize(['wonder-black','wonder-black'],$('quickBlack'));$('quickSweet').onclick=()=>quickSynthesize(['wonder-black','luna-sweet'],$('quickSweet'));$('synthBtn').onclick=synth;$('autoStart').onclick=startAuto;$('slotA').onclick=clearSelected;$('slotB').onclick=clearSelected;$('resetBtn').onclick=()=>{stopAuto();if(confirm('현재 세션 기록과 재료를 모두 초기화할까요?')){state.inv=Object.fromEntries(ALL_ITEMS.map(x=>[x.id,0]));state.selected=[];state.spent=state.pulls=state.synths=state.petResults=state.sessionBlack=state.sessionDream=state.sessionPetit=0;state.synthPetitProbs=[];state.last=null;state.lastBatch=[];state.log=[];render();}};render();
})();
</script>
