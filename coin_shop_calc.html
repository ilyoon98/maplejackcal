<!doctype html>
<html lang="ko">
<head>
<link rel="icon" type="image/png" href="favicon.png?v=2" />
<meta name="description" content="메이플스토리 확률, 비용, 보스 수익, 뽑기를 계산하고 시뮬레이션하는 도구 모음" />
<meta property="og:type" content="website" />
<meta property="og:title" content="메이플 계산기 모음" />
<meta property="og:description" content="메이플스토리 확률, 비용, 보스 수익, 뽑기를 계산하고 시뮬레이션하는 도구 모음" />
<meta property="og:image" content="https://maplejackcal.vercel.app/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:image" content="https://maplejackcal.vercel.app/og-image.png" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이벤트 코인샵 계산</title>
<link rel="stylesheet" href="style.css" />
<style>
  :root{ --surface-2:#1d212b; }

  /* 오른쪽 요약 컬럼: 장바구니가 길어져 화면보다 커져도 아래쪽이 잘리지 않게 컬럼 안에서 스크롤 */
  @media (min-width: 961px){
    .layout-right{ max-height: calc(100vh - 32px); overflow-y:auto; scrollbar-width:thin; padding-right:2px; }
  }

  /* 코인 획득량 — 3칸 + 주차 선택 */
  .coin-fields{ grid-template-columns:repeat(3, minmax(0,1fr)); }
  .coin-fields .field input{ width:100%; min-width:0; }
  .field .help{ font-size:0.72rem; color:var(--text-dim); margin-top:2px; }
  .week-row{ display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; margin-top:4px; }
  .week-row .week-label{ font-size:0.82rem; color:var(--text-dim); }
  .week-pills{ display:flex; flex-wrap:wrap; gap:4px; }
  .week-pill{
    min-width:34px; height:30px; padding:0 8px; border-radius:8px;
    border:1px solid var(--border); background:#11141a; color:var(--text-dim);
    font:inherit; font-size:0.82rem; font-weight:700; cursor:pointer;
    font-variant-numeric:tabular-nums;
  }
  .week-pill:hover{ border-color:var(--accent); color:var(--text); }
  .week-pill.active{ background:var(--accent-strong); border-color:var(--accent-strong); color:#0b0d12; }
  @media (max-width: 600px){
    .coin-fields{ grid-template-columns:1fr 1fr; }
    .coin-fields .field:last-child{ grid-column:1/-1; }
  }

  /* 상점 헤더: 탭 + 보기 옵션 */
  .shop-head{ display:flex; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:12px; }
  .shop-tabs{ display:inline-flex; background:#1d212b; border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; }
  .shop-tabs button{
    border:none; background:none; color:var(--text-dim);
    font:inherit; font-size:0.85rem; font-weight:700;
    padding:8px 18px; border-radius:8px; cursor:pointer;
  }
  .shop-tabs button:hover{ color:var(--text); }
  .shop-tabs button.active{ background:var(--accent-strong); color:#0b0d12; }
  .shop-tabs .tab-count{ font-weight:800; margin-left:6px; opacity:.85; }
  .shop-opts{ display:flex; gap:6px; margin-left:auto; }
  .opt-btn{
    height:30px; padding:0 11px; border-radius:999px;
    border:1px solid var(--border); background:none; color:var(--text-dim);
    font:inherit; font-size:0.76rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .opt-btn:hover{ border-color:var(--accent); color:var(--text); }
  .opt-btn.active{ border-color:var(--accent-strong); background:rgba(76,141,255,.14); color:var(--accent); }
  .shop-hint{ font-size:0.76rem; color:var(--text-dim); margin:0 0 12px; }
  .shop-hint b{ color:var(--text); font-weight:700; }
  .max-btn.week-fill:hover:not(:disabled){ border-color:var(--good); color:var(--good); }
  /* 아주 좁은 화면에선 버튼이 한 줄에 안 들어가니 × 는 뺀다 (−로 0까지 내릴 수 있다) */
  @media (max-width: 480px){ .clear-btn{ display:none; } }
  /* "이미 산 것 입력" 모드: 안내를 배너로 키우고 상점 전체가 초록 톤으로 바뀌어 모드에 들어왔음을 알린다 */
  body.own-edit-on .shop-hint{
    background:rgba(76,175,125,.1); border:1px solid var(--good); border-radius:10px;
    padding:10px 12px; color:var(--text); font-size:0.8rem; line-height:1.5;
  }
  body.own-edit-on .shop-hint b{ color:var(--good); }
  .opt-btn.mode-on{ border-color:var(--good); background:var(--good); color:#0b0d12; }
  .shop-empty{ color:var(--text-dim); font-size:0.84rem; padding:14px 4px; }

  /* 아이템 행: 아이콘 · 이름/제한 · 가격+수량 */
  .item-list{ display:flex; flex-direction:column; gap:8px; }
  .item-row{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:center;
    gap:12px;
    background:#11141a;
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px 12px;
    transition:border-color .12s, background .12s;
  }
  .item-row.picked{ border-color:var(--accent-strong); background:#18213a; }
  .item-row.done{ border-color:rgba(76,175,125,.55); background:rgba(76,175,125,.05); }
  .item-row.done .item-name{ color:var(--text-dim); }

  /* 아이콘 — 누르면 1개 담긴다. hover 시 +1 배지로 알려준다 */
  .item-icon{
    position:relative;
    display:flex; align-items:center; justify-content:center; gap:3px;
    width:60px; height:60px; padding:4px;
    background:#1d212b; border:1px solid var(--border); border-radius:10px;
    color:var(--text); font:inherit; font-size:28px; line-height:1; cursor:pointer;
  }
  .item-icon::after{
    content:'+1'; position:absolute; right:-6px; top:-6px;
    padding:1px 5px; border-radius:999px;
    background:var(--accent-strong); color:#0b0d12;
    font-size:0.66rem; font-weight:800; line-height:1.4;
    opacity:0; transform:scale(.8); transition:opacity .12s, transform .12s;
  }
  .item-icon:hover:not(:disabled){ border-color:var(--accent); }
  .item-icon:hover:not(:disabled)::after{ opacity:1; transform:scale(1); }
  .item-icon:disabled{ cursor:default; opacity:.6; }
  .item-row.picked .item-icon{ border-color:var(--accent-strong); background:#1a2135; }
  .item-icon img{ width:44px; height:44px; object-fit:contain; image-rendering:pixelated; }
  .item-icon.pair img{ width:28px; height:28px; }

  .item-body{ display:flex; flex-direction:column; justify-content:center; gap:3px; min-width:0; }
  .item-name{ font-size:0.98rem; font-weight:700; line-height:1.3; word-break:keep-all; }
  .item-sub{ display:flex; flex-wrap:wrap; gap:4px 10px; font-size:0.74rem; color:var(--text-dim); font-variant-numeric:tabular-nums; }
  .item-sub .sub-owned{ color:var(--good); font-weight:700; }
  .item-sub .sub-done{ color:var(--good); font-weight:700; }

  /* "이미 산 것 입력" 모드: 장바구니 스테퍼 자리에 초록 스테퍼가 대신 들어간다. 한 번에 하나만 만지게 */
  .own-row{ display:none; align-items:center; gap:5px; }
  body.own-edit-on .buy-row{ display:none; }
  body.own-edit-on .own-row{ display:flex; }
  body.own-edit-on .item-sub .sub-owned, body.own-edit-on .item-sub .sub-done{ display:none; }
  .own-row .qty-input{ border-color:var(--good); color:var(--good); }
  .own-row .qty-btn:hover:not(:disabled), .own-row .max-btn:hover:not(:disabled){ border-color:var(--good); color:var(--good); }
  .own-row .qty-cap{ color:var(--text-dim); }
  body.own-edit-on .row-total{ color:var(--good); }
  body.own-edit-on .item-row.picked{ border-color:var(--border); background:#11141a; }
  body.own-edit-on .item-row.picked .item-icon{ border-color:var(--border); background:#1d212b; }
  body.own-edit-on .item-row.owned{ border-color:rgba(76,175,125,.55); background:rgba(76,175,125,.05); }
  body.own-edit-on .item-row.owned .item-icon{ border-color:var(--good); }
  body.own-edit-on .item-icon::after{ background:var(--good); }
  body.own-edit-on .item-icon:hover:not(:disabled){ border-color:var(--good); }

  /* 오른쪽: 가격 줄 + 수량 조절 */
  .item-buy{ display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  /* 가격 줄은 담기 전후로 폭이 같아야 카드 크기가 안 바뀐다.
     총액 칸을 항상 두고(안 담았을 땐 투명) 폭은 가장 긴 경우("10,000 코인 → 30,000 코인")에 맞춘다 */
  .price-line{ display:flex; align-items:baseline; justify-content:flex-end; gap:6px; min-width:200px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .unit-price{ font-size:0.86rem; font-weight:700; color:var(--text-dim); }
  .unit-price i{ font-style:normal; font-size:0.7rem; margin-left:2px; }
  .row-total{ font-size:1.05rem; font-weight:800; color:var(--accent); }
  .row-total i{ font-style:normal; font-size:0.7rem; font-weight:700; color:var(--text-dim); margin-left:3px; }
  .price-line .arrow{ color:var(--text-dim); font-size:0.8rem; }


  .buy-row{ display:flex; align-items:center; gap:5px; }
  .qty-btn{
    width:32px; height:32px; border-radius:8px;
    border:1px solid var(--border); background:#1d212b; color:var(--text);
    font-size:17px; font-weight:800; line-height:1; cursor:pointer;
  }
  .qty-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .qty-btn:disabled{ opacity:.3; cursor:default; }
  .qty-input{
    width:56px; height:32px; text-align:center;
    background:#11141a; border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-size:1.02rem; font-weight:800;
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .item-row.picked .qty-input{ border-color:var(--accent-strong); }
  .qty-input:disabled{ opacity:.4; }
  .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  /* 담을 수 있는 최대치를 입력칸 바로 옆에 붙인다. 다 담으면 MAX 배지로 바뀐다 */
  .qty-cap{ min-width:38px; font-size:0.74rem; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .qty-cap.maxed{ color:var(--good); font-weight:800; }
  .max-btn{
    height:28px; padding:0 9px; border-radius:8px;
    border:1px solid var(--border); background:#1d212b; color:var(--text-dim);
    font:inherit; font-size:0.74rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .max-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .max-btn:disabled{ opacity:.3; cursor:default; }
  .clear-btn{
    width:28px; height:28px; border-radius:8px;
    border:1px solid var(--border); background:#1d212b; color:var(--text-dim);
    font-size:14px; font-weight:800; line-height:1; cursor:pointer;
    visibility:hidden;
  }
  .item-row.picked .clear-btn{ visibility:visible; }
  .clear-btn:hover{ border-color:var(--bad); color:var(--bad); }

  @media (max-width: 780px){
    .item-row{ grid-template-columns:auto minmax(0,1fr); gap:10px 12px; }
    .item-buy{ grid-column:1/-1; flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .item-icon{ width:52px; height:52px; }
    .item-icon img{ width:38px; height:38px; }
    .item-icon.pair img{ width:24px; height:24px; }
  }

  /* 요약 카드: 전체 예산 기준과 이번 주 기준을 나란히 */
  .big-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:end; }
  .coin-line{ display:flex; align-items:baseline; gap:6px; flex-wrap:wrap; }
  .coin-of{ font-size:0.8rem; font-weight:700; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .big-label{ font-size:0.74rem; color:var(--text-dim); font-weight:700; }
  .coin-big.now{ font-size:1.6rem; color:var(--accent); }
  .coin-big.now.over{ color:var(--bad); }
  .coin-big{ font-size:2.1rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15; }
  .coin-big.ok{ color:var(--good); }
  .coin-big.over{ color:var(--bad); }
  .bar{ position:relative; display:flex; height:10px; border-radius:999px; background:#11141a; border:1px solid var(--border); overflow:hidden; margin:12px 0 6px; }
  .bar span{ display:block; height:100%; transition:width .2s; }
  .bar .bar-now{ position:absolute; top:0; bottom:0; width:2px; background:var(--text); transition:left .2s; }
  .bar .fill-owned{ background:var(--good); }
  .bar .fill-cart{ background:var(--accent-strong); }
  .bar.over .fill-cart{ background:var(--bad); }
  .bar-legend{ display:flex; gap:12px; font-size:0.72rem; color:var(--text-dim); margin-top:2px; }
  .bar-legend i{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
  .bar-legend .k-owned i{ background:var(--good); }
  .bar-legend .k-cart i{ background:var(--accent-strong); }
  .bar-legend .k-now i{ width:2px; height:10px; border-radius:1px; background:var(--text); }
  .mini-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:10px; }
  .mini{ background:#11141a; border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .mini .label{ font-size:0.72rem; color:var(--text-dim); }
  .mini .value{ font-size:0.95rem; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .mini .sub{ font-size:0.7rem; color:var(--bad); font-weight:700; margin-top:2px; }
  .mini.now .value{ color:var(--accent); }
  .callout.warn{ background:rgba(226,102,74,0.1); border-color:var(--bad); }
  .callout.good{ background:rgba(76,175,125,0.1); border-color:var(--good); }

  /* 장바구니 / 구매 완료 */
  .list-head{ display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  .list-head h2{ margin:0; }
  .list-sum{ margin-left:auto; font-size:0.8rem; color:var(--text-dim); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .list-sum b{ color:var(--accent); font-size:0.9rem; margin-left:4px; }
  #ownedCard .list-sum b{ color:var(--good); }
  .owned-edit-link{ padding:3px 9px; font-size:11.5px; }
  .plan-note{ font-size:0.72rem; color:var(--text-dim); margin:0 0 6px; }
  .cart-list{ display:flex; flex-direction:column; }
  .cart-row{ display:flex; align-items:center; gap:8px; padding:8px 0; font-size:0.84rem; }
  .cart-name{ flex:1 1 auto; }
  .cart-row + .cart-row{ border-top:1px solid var(--border); }
  .cart-name{ min-width:0; word-break:keep-all; }
  .cart-name em{ font-style:normal; color:var(--text-dim); font-size:0.78rem; margin-left:4px; }
  .cart-week{
    font-size:0.68rem; font-weight:800; padding:2px 6px; border-radius:5px;
    background:rgba(110,168,254,.15); color:var(--accent); white-space:nowrap;
  }
  .cart-week.now{ background:rgba(76,175,125,.15); color:var(--good); }
  .cart-week.late{ background:rgba(226,102,74,.15); color:var(--bad); }
  .cart-cost{ color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cart-row.is-owned .cart-cost{ color:var(--good); }
  .cart-actions{ display:flex; gap:4px; }
  .cart-btn{
    width:24px; height:24px; border-radius:50%; border:none;
    font-size:13px; line-height:1; cursor:pointer;
  }
  .cart-btn.buy{ background:rgba(76,175,125,.15); color:var(--good); }
  .cart-btn.buy:hover{ background:rgba(76,175,125,.3); }
  .cart-btn.del{ background:rgba(226,102,74,.15); color:var(--bad); }
  .cart-btn.del:hover{ background:rgba(226,102,74,.3); }
  .cart-btn.mv{ background:#1d212b; color:var(--text-dim); font-size:11px; }
  .cart-btn.mv:hover:not(:disabled){ color:var(--text); background:#2a2e38; }
  .cart-btn.mv:disabled{ opacity:.25; cursor:default; }
  .cart-name .part{ font-style:normal; color:var(--text-dim); font-size:0.72rem; margin-left:3px; }

  /* 장바구니 보기 전환 (주차별 / 목록) */
  .view-tabs{ display:inline-flex; background:#1d212b; border:1px solid var(--border); border-radius:8px; padding:2px; gap:2px; }
  .view-tabs button{ border:none; background:none; color:var(--text-dim); font:inherit; font-size:0.72rem; font-weight:700; padding:3px 9px; border-radius:6px; cursor:pointer; }
  .view-tabs button.active{ background:var(--accent-strong); color:#0b0d12; }

  /* 주차별 계획 */
  .past-note{ font-size:0.74rem; color:var(--text-dim); margin:0 0 4px; }
  .wk{ background:#11141a; border:1px solid var(--border); border-radius:10px; padding:8px 10px; margin-top:8px; }
  .wk.now{ border-color:var(--accent-strong); background:#18213a; }
  .wk.over{ border-color:var(--bad); background:rgba(226,102,74,.06); }
  .wk-head{ display:flex; align-items:baseline; gap:8px; font-size:0.82rem; font-weight:800; }
  .wk.now .wk-head{ color:var(--accent); }
  .wk.over .wk-head{ color:var(--bad); }
  .wk-head .wk-tag{ font-size:0.66rem; font-weight:800; padding:1px 6px; border-radius:5px; background:rgba(110,168,254,.15); color:var(--accent); }
  .wk-head .wk-avail{ margin-left:auto; font-size:0.72rem; font-weight:700; color:var(--text-dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .wk-head .wk-avail b{ color:var(--text); }
  .wk .cart-row{ padding:6px 0; font-size:0.8rem; }
  .wk .cart-empty{ margin:6px 0 2px; font-size:0.78rem; }
  .wk-foot{ display:flex; align-items:center; gap:8px; font-size:0.74rem; color:var(--text-dim); margin-top:4px; padding-top:6px; border-top:1px dashed var(--border); font-variant-numeric:tabular-nums; }
  .wk-foot b{ color:var(--good); }
  .wk.over .wk-foot b{ color:var(--bad); }
  .wk-foot .link-btn{ margin-left:auto; padding:3px 9px; font-size:11px; }
  .wk-gap{ font-size:0.74rem; color:var(--text-dim); margin:8px 4px 0; }
  .cart-empty{ color:var(--text-dim); font-size:0.84rem; margin:6px 0 0; }
  .btn-row{ display:flex; gap:8px; margin-top:12px; }
  .btn-row .link-btn{ flex:1; text-align:center; padding:7px 8px; }
  .btn-row .link-btn:disabled{ opacity:.35; cursor:default; border-color:var(--border); color:var(--text-dim); }
  /* 되돌릴 수 없는 버튼은 한 번 더 눌러야 실행된다 */
  .link-btn.armed{ border-color:var(--bad); color:var(--bad); }

  /* 모바일: 요약이 맨 아래로 내려가니 하단 고정 바로 남은 코인을 항상 보여준다 */
  .mobile-bar{ display:none; }
  @media (max-width: 960px){
    .wrap{ padding-bottom:96px; }
    .mobile-bar{
      position:fixed; left:0; right:0; bottom:0; z-index:20;
      display:flex; align-items:center; gap:12px;
      padding:10px 16px calc(10px + env(safe-area-inset-bottom));
      background:rgba(23,26,33,.96); border-top:1px solid var(--border);
      backdrop-filter:blur(8px);
      cursor:pointer; user-select:none;
    }
    .mobile-bar .mb-main{ display:flex; flex-direction:column; line-height:1.2; }
    .mobile-bar .mb-label{ font-size:0.7rem; color:var(--text-dim); }
    .mobile-bar .mb-remain{ font-size:1.3rem; font-weight:800; font-variant-numeric:tabular-nums; }
    .mobile-bar .mb-remain.ok{ color:var(--good); }
    .mobile-bar .mb-remain.over{ color:var(--bad); }
    .mobile-bar .mb-side{ display:flex; flex-direction:column; align-items:flex-end; margin-left:auto; line-height:1.25; text-align:right; }
    .mobile-bar .mb-cart{ font-size:0.78rem; color:var(--text-dim); font-variant-numeric:tabular-nums; }

<script>
(function(){
  // 상점 데이터는 coin_shop_data.js에 있다. 이벤트가 바뀌면 그 파일만 고친다.
  var EVENT = window.COIN_SHOP_EVENT;
  var SHOP = EVENT.shop;
  var TABS = EVENT.tabs;
  var TAB_LABEL = {};
  TABS.forEach(function(t){ TAB_LABEL[t.key] = t.label; });
  var LIMIT_LABEL = { M:'ID당', W:'월드당' };
  var ALL = TABS.reduce(function(acc, t){ return acc.concat(SHOP[t.key]); }, []);
  var BY_ID = {};
  ALL.forEach(function(it){ BY_ID[it.id] = it; });

  // 저장 키에 이벤트 id를 붙여, 다음 이벤트 때 지난 장바구니가 섞이지 않게 한다
  var STORE_KEY = 'coinShopPlan.' + EVENT.id;
  var LEGACY_KEY = 'coinShopPlan.v1';   // id를 붙이기 전에 쓰던 키(아르고 주화 2026 가을)
  var cart = {};                 // id -> 담아둔 수량. 키 순서 = 담은 순서 = 구매 우선순위
  var owned = {};                // id -> 이미 구매한 수량
  var settings = { perWeek:EVENT.perWeek, weeks:EVENT.weeks, currentWeek:1, extraSpent:0 };
  var activeTab = TABS[0].key;
  var view = { onlyPicked:false, ownedEdit:false, cartView:'list' };

  var el = {};
  ['perWeek','weeks','extraSpent','weekPills','budgetNote','shopLists','shopTabs','eventSub',
   'onlyPickedBtn','ownedEditBtn','shopHint',
   'remainBig','remainLabel','remainOf','nowLeftBig','nowLeftOf','bar','barOwned','barCart','barNow','nowLabel','nowCoin','spentCoin','usedCoin',
   'progressNote','weekNote','cartSum','planNote','cartList','buyAllBtn','clearBtn','ownedCard','ownedSum','ownedList','resetOwnedBtn',
   'mobileBar','mbRemain','mbCart','mbWeek','summaryCard','ownedEditLink','cartViewTabs'
  ].forEach(function(id){ el[id] = document.getElementById(id); });

  function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }
  function signed(n){ return (n < 0 ? '−' : '') + fmt(Math.abs(n)); }
  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw && EVENT.id === 'argo-2026-fall') raw = localStorage.getItem(LEGACY_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      function restore(src, target, capOf){
        if (!src) return;
        Object.keys(src).forEach(function(id){
          var item = BY_ID[id];
          if (!item) return;                        // 상점 구성이 바뀌어 사라진 항목은 무시
          var q = clamp(parseInt(src[id], 10) || 0, 0, capOf(item));
          if (q > 0) target[id] = q;
        });
      }
      restore(saved && saved.owned, owned, function(item){ return item.stock; });
      restore(saved && saved.cart, cart, function(item){ return item.stock - (owned[item.id] || 0); });
      if (saved && saved.settings) {
        settings.perWeek = Math.max(0, Number(saved.settings.perWeek) || 0);
        settings.weeks = Math.max(1, Number(saved.settings.weeks) || 1);
        settings.currentWeek = clamp(Number(saved.settings.currentWeek) || 1, 1, settings.weeks);
        settings.extraSpent = Math.max(0, Number(saved.settings.extraSpent) || 0);
      }
      if (saved && TAB_LABEL[saved.tab]) activeTab = saved.tab;
      if (saved && (saved.cartView === 'list' || saved.cartView === 'weekly')) view.cartView = saved.cartView;
    } catch (e) { /* 저장값이 깨졌으면 기본값으로 시작 */ }
  }
  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ cart:cart, owned:owned, settings:settings, tab:activeTab, cartView:view.cartView }));
    } catch (e) {}
  }

  function coinsOf(map){
    return Object.keys(map).reduce(function(sum, id){ return sum + BY_ID[id].price * map[id]; }, 0);
  }
  function countOf(map){
    return Object.keys(map).reduce(function(sum, id){ return sum + map[id]; }, 0);
  }
  function totalCoins(){ return settings.perWeek * settings.weeks; }   // 기간 동안 받는 코인 전체
  function nowCoins(){ return settings.perWeek * settings.currentWeek; } // 현재 주차까지 받은 코인
  function spentCoins(){ return coinsOf(owned) + settings.extraSpent; } // 이미 쓴 코인
  function usedCoins(){ return coinsOf(cart); }                        // 장바구니에 담은 코인
  // 이번 주까지 받은 코인에서 이미 쓴 것과 장바구니를 빼면 "이번 주에 더 쓸 수 있는 코인" (넘치면 음수)
  function nowLeftCoins(){ return nowCoins() - spentCoins() - usedCoins(); }
  function leftToBuy(id){ return BY_ID[id].stock - (owned[id] || 0); } // 아직 살 수 있는 수량
  // 누적 코인 c를 손에 넣는 주차 (0이면 지금, Infinity면 주당 코인이 없어 계산 불가)
  function weekFor(c){
    if (c <= 0) return 0;
    if (settings.perWeek <= 0) return Infinity;
    return Math.ceil(c / settings.perWeek);
  }

  function setQty(id, qty){
    var q = clamp(Math.floor(qty) || 0, 0, leftToBuy(id));
    if (q === 0) delete cart[id]; else cart[id] = q;
    save();
    render();
  }

  function setOwned(id, n){
    var item = BY_ID[id];
    var q = clamp(Math.floor(n) || 0, 0, item.stock);
    if (q === 0) delete owned[id]; else owned[id] = q;
    // 이미 구매한 만큼 구매 한도가 줄어드니 장바구니 수량도 같이 깎는다
    if (cart[id] && cart[id] > item.stock - q) {
      var rest = item.stock - q;
      if (rest <= 0) delete cart[id]; else cart[id] = rest;
    }
    save();
    render();
  }

  // 장바구니의 n개(기본은 전부)를 "구매 완료"로 옮긴다
  function buyFromCart(id, n){
    if (!cart[id]) return;
    var q = Math.min(cart[id], n == null ? cart[id] : n);
    owned[id] = Math.min(BY_ID[id].stock, (owned[id] || 0) + q);
    if (cart[id] - q <= 0) delete cart[id]; else cart[id] = cart[id] - q;
    save();
    render();
  }

  // 담은 순서 = 구매 우선순위. 객체 키 순서를 바꾸려면 다시 만들어야 한다
  function moveCart(id, dir){
    var ids = Object.keys(cart);
    var i = ids.indexOf(id), j = i + dir;
    if (i < 0 || j < 0 || j >= ids.length) return;
    ids[i] = ids[j]; ids[j] = id;
    var next = {};
    ids.forEach(function(k){ next[k] = cart[k]; });
    cart = next;
    save();
    render();
  }

  // 주차별 계획: 담은 순서대로, 이번 주부터 매주 들어오는 코인으로 채워 나간다.
  // 한 품목이 한 주에 다 안 되면 살 수 있는 만큼만 넣고 나머지는 다음 주로 넘긴다.
  function buildSchedule(){
    var perWeek = settings.perWeek;
    var carry = nowCoins() - spentCoins();           // 이번 주까지 받은 코인 중 남은 것
    var cur = { week:settings.currentWeek, start:carry, items:[], left:carry };
    var weeks = [cur];
    var over = { items:[], cost:0 };
    var avail = carry;
    Object.keys(cart).forEach(function(id){
      var price = BY_ID[id].price;
      var qty = cart[id];
      while (qty > 0) {
        if (!cur) { over.items.push({ id:id, qty:qty }); over.cost += qty * price; break; }
        var n = Math.min(qty, Math.max(0, Math.floor(avail / price)));
        if (n > 0) { cur.items.push({ id:id, qty:n }); avail -= n * price; cur.left = avail; qty -= n; }
        if (qty > 0) {
          if (cur.week >= settings.weeks || perWeek <= 0) { cur = null; }
          else {
            avail += perWeek;
            cur = { week:cur.week + 1, start:avail, items:[], left:avail };
            weeks.push(cur);
          }
        }
      }
    });
    // 기간 초과분은 전체 예산(기간 동안 받는 코인 전부) 기준으로 얼마나 모자란지도 같이 준다
    return { weeks:weeks, over:over, carry:carry, shortfall:Math.max(0, spentCoins() + usedCoins() - totalCoins()) };
  }

  // ---- 아이템 목록 ----
  function buildRow(item){
    var row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.id = item.id;
    row.innerHTML =
      '<button type="button" class="item-icon"></button>' +
      '<div class="item-body">' +
        '<div class="item-name"></div>' +
        '<div class="item-sub">' +
          '<span class="sub-limit"></span>' +
          '<span class="sub-owned hidden"></span>' +
          '<span class="sub-done hidden">전량 구매 완료</span>' +
        '</div>' +
      '</div>' +
      '<div class="item-buy">' +
        '<div class="price-line">' +
          '<span class="unit-price"></span>' +
          '<span class="arrow">→</span>' +
          '<span class="row-total"></span>' +
        '</div>' +
        '<div class="buy-row">' +
          '<button type="button" class="qty-btn minus">−</button>' +
          '<input type="number" class="qty-input" min="0" value="0" inputmode="numeric">' +
          '<button type="button" class="qty-btn plus">+</button>' +
          '<span class="qty-cap"></span>' +
          '<button type="button" class="max-btn max-all">최대</button>' +
          '<button type="button" class="max-btn week-fill">이번 주</button>' +
          '<button type="button" class="clear-btn">×</button>' +
        '</div>' +
        '<div class="own-row">' +
          '<button type="button" class="qty-btn own-minus">−</button>' +
          '<input type="number" class="qty-input own-input" min="0" value="0" inputmode="numeric">' +
          '<button type="button" class="qty-btn own-plus">+</button>' +
          '<span class="qty-cap own-cap"></span>' +
          '<button type="button" class="max-btn own-all">전량</button>' +
        '</div>' +
      '</div>';

    // 실제 아이템 아이콘이 있으면 쓰고, 없는 항목만 이모지로 대신한다
    var iconBox = row.querySelector('.item-icon');
    iconBox.setAttribute('aria-label', item.name + ' 1개 담기');
    iconBox.title = '1개 담기';
    if (item.img) {
      var files = [].concat(item.img);
      iconBox.classList.toggle('pair', files.length > 1);
      files.forEach(function(file){
        var img = document.createElement('img');
        img.src = 'icons/' + encodeURIComponent(file);
        img.alt = '';
        // 아이콘 파일이 없거나 깨지면 조용히 이모지로 되돌린다
        img.addEventListener('error', function(){
          iconBox.classList.remove('pair');
          iconBox.textContent = item.icon;
        });
        iconBox.appendChild(img);
      });
    } else {
      iconBox.textContent = item.icon;
    }
    row.querySelector('.item-name').textContent = item.name;
    row.querySelector('.sub-limit').textContent = LIMIT_LABEL[item.limit] + ' ' + fmt(item.stock) + '개';
    row.querySelector('.unit-price').innerHTML = fmt(item.price) + '<i>코인</i>';

    var label = function(sel, text){ row.querySelector(sel).setAttribute('aria-label', item.name + ' ' + text); };
    label('.plus', '1개 더 담기');
    label('.minus', '1개 빼기');
    label('.max-all', '구매 제한까지 담기');
    label('.week-fill', '이번 주 남은 코인으로 살 수 있는 만큼 담기');
    row.querySelector('.week-fill').title = '이번 주 남은 코인으로 살 수 있는 만큼 담기';
    label('.clear-btn', '장바구니에서 빼기');
    label('.qty-input', '담을 수량');
    label('.own-plus', '이미 산 개수 1 늘리기');
    label('.own-minus', '이미 산 개수 1 줄이기');
    label('.own-all', '전량 구매한 것으로 기록');
    label('.own-input', '이미 산 개수');

    // 아이콘은 "누르면 1개": 평소엔 장바구니에, 이미 산 것 입력 모드에선 구매 기록에
    iconBox.addEventListener('click', function(){
      if (view.ownedEdit) setOwned(item.id, (owned[item.id] || 0) + 1);
      else setQty(item.id, (cart[item.id] || 0) + 1);
    });
    row.querySelector('.plus').addEventListener('click', function(){ setQty(item.id, (cart[item.id] || 0) + 1); });
    row.querySelector('.minus').addEventListener('click', function(){ setQty(item.id, (cart[item.id] || 0) - 1); });
    row.querySelector('.clear-btn').addEventListener('click', function(){ setQty(item.id, 0); });
    row.querySelector('.max-all').addEventListener('click', function(){ setQty(item.id, leftToBuy(item.id)); });
    row.querySelector('.week-fill').addEventListener('click', function(){
      setQty(item.id, (cart[item.id] || 0) + Math.floor(Math.max(0, nowLeftCoins()) / item.price));
    });
    row.querySelector('.own-plus').addEventListener('click', function(){ setOwned(item.id, (owned[item.id] || 0) + 1); });
    row.querySelector('.own-minus').addEventListener('click', function(){ setOwned(item.id, (owned[item.id] || 0) - 1); });
    row.querySelector('.own-all').addEventListener('click', function(){
      // 이미 전량 구매 상태면 한 번 더 누를 때 취소되게
      setOwned(item.id, (owned[item.id] || 0) === item.stock ? 0 : item.stock);
    });
    var input = row.querySelector('.qty-input');
    input.addEventListener('input', function(){ setQty(item.id, parseInt(input.value, 10)); });
    // 입력 중엔 커서가 튀지 않게 값을 안 건드리므로, 입력이 끝나면 실제 저장된 수량으로 되돌려 적는다
    input.addEventListener('change', function(){ input.value = String(cart[item.id] || 0); });
    input.addEventListener('focus', function(){ input.select(); });
    var ownInput = row.querySelector('.own-input');
    ownInput.addEventListener('input', function(){ setOwned(item.id, parseInt(ownInput.value, 10)); });
    ownInput.addEventListener('change', function(){ ownInput.value = String(owned[item.id] || 0); });
    ownInput.addEventListener('focus', function(){ ownInput.select(); });
    return row;
  }

  var listOf = {};   // tab key -> 목록 컨테이너
  var cntOf = {};    // tab key -> 탭 버튼의 담은 종 수
  function buildShop(){
    TABS.forEach(function(t){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.dataset.tab = t.key;
      btn.textContent = t.label;
      var cnt = document.createElement('span');
      cnt.className = 'tab-count';
      btn.appendChild(cnt);
      el.shopTabs.appendChild(btn);
      cntOf[t.key] = cnt;

      var list = document.createElement('div');
      list.className = 'item-list hidden';
      SHOP[t.key].forEach(function(item){ list.appendChild(buildRow(item)); });
      el.shopLists.appendChild(list);
      listOf[t.key] = list;
    });
  }

  function refreshRow(row){
    var item = BY_ID[row.dataset.id];
    var qty = cart[item.id] || 0;
    var own = owned[item.id] || 0;
    var buyable = item.stock - own;          // 아직 살 수 있는 수량
    var done = own >= item.stock;            // 전량 구매 완료
    var maxed = qty > 0 && qty >= buyable;

    row.classList.toggle('picked', qty > 0);
    row.classList.toggle('owned', own > 0);
    row.classList.toggle('done', done);
    row.classList.toggle('hidden', view.onlyPicked && qty === 0);

    var subOwned = row.querySelector('.sub-owned');
    subOwned.textContent = '이미 구매 ' + fmt(own);
    subOwned.classList.toggle('hidden', own === 0 || done);
    row.querySelector('.sub-done').classList.toggle('hidden', !done);

    // 이미 산 것 입력 모드에선 총액 자리에 "이미 사용" 코인을 보여준다
    var total = row.querySelector('.row-total');
    total.innerHTML = view.ownedEdit
      ? fmt(item.price * own) + '<i>코인 사용</i>'
      : fmt(item.price * qty) + '<i>코인</i>';
    var showTotal = view.ownedEdit ? own > 0 : qty > 0;
    total.style.visibility = showTotal ? 'visible' : 'hidden';
    row.querySelector('.price-line .arrow').style.visibility = showTotal ? 'visible' : 'hidden';

    var input = row.querySelector('.qty-input');
    input.max = buyable;
    // 입력 중인 칸은 건드리지 않는다 (커서가 튀지 않게)
    if (document.activeElement !== input) input.value = String(qty);
    input.disabled = done;
    row.querySelector('.item-icon').disabled = view.ownedEdit ? done : (done || maxed);
    row.querySelector('.minus').disabled = qty <= 0;
    row.querySelector('.plus').disabled = qty >= buyable;
    row.querySelector('.max-all').disabled = done || maxed;
    row.querySelector('.week-fill').disabled = done || maxed || nowLeftCoins() < item.price;

    var cap = row.querySelector('.qty-cap');
    cap.classList.toggle('maxed', maxed);
    cap.textContent = done ? '' : (maxed ? 'MAX' : '/ ' + fmt(buyable));

    var ownInput = row.querySelector('.own-input');
    ownInput.max = item.stock;
    if (document.activeElement !== ownInput) ownInput.value = String(own);
    row.querySelector('.own-minus').disabled = own <= 0;
    row.querySelector('.own-plus').disabled = own >= item.stock;
    row.querySelector('.own-cap').textContent = '/ ' + fmt(item.stock);
    row.querySelector('.own-all').textContent = done ? '취소' : '전량';
  }

  // ---- 장바구니 / 구매 완료 ----
  function cartRow(item, qty, extra){
    var row = document.createElement('div');
    row.className = 'cart-row' + (extra.cls ? ' ' + extra.cls : '');
    var name = document.createElement('span');
    name.className = 'cart-name';
    name.textContent = item.name;
    var em = document.createElement('em');
    em.textContent = '×' + fmt(qty);
    name.appendChild(em);
    if (extra.part) {
      var part = document.createElement('em');
      part.className = 'part';
      part.textContent = extra.part;
      name.appendChild(part);
    }
    row.appendChild(name);

    if (extra.week) row.appendChild(extra.week);

    var cost = document.createElement('span');
    cost.className = 'cart-cost';
    cost.textContent = fmt(item.price * qty);
    row.appendChild(cost);

    var actions = document.createElement('span');
    actions.className = 'cart-actions';
    (extra.buttons || []).forEach(function(b){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cart-btn ' + b.cls;
      btn.textContent = b.text;
      btn.title = b.title;
      btn.setAttribute('aria-label', item.name + ' ' + b.title);
      btn.disabled = !!b.disabled;
      btn.addEventListener('click', b.onClick);
      actions.appendChild(btn);
    });
    row.appendChild(actions);
    return row;
  }

  // 순서 바꾸기 버튼 두 개 (맨 위/맨 아래에서는 비활성)
  function moveButtons(id){
    var ids = Object.keys(cart), i = ids.indexOf(id);
    return [
      { cls:'mv', text:'▲', title:'먼저 사기', disabled:i <= 0, onClick:function(){ moveCart(id, -1); } },
      { cls:'mv', text:'▼', title:'나중에 사기', disabled:i >= ids.length - 1, onClick:function(){ moveCart(id, 1); } }
    ];
  }

  function renderCartList(ids){
    // 담은 순서대로 산다고 보고, 누적 코인이 몇 주차에 모이는지 표시한다
    var cum = spentCoins();
    ids.forEach(function(id){
      var item = BY_ID[id];
      cum += item.price * cart[id];
      var week = weekFor(cum);
      var tag = null;
      if (isFinite(week)) {
        tag = document.createElement('span');
        tag.className = 'cart-week';
        if (week <= settings.currentWeek) { tag.classList.add('now'); tag.textContent = '지금'; }
        else if (week <= settings.weeks) { tag.textContent = week + '주차'; }
        else { tag.classList.add('late'); tag.textContent = week + '주차'; tag.title = '기간(' + settings.weeks + '주) 안에는 못 삽니다'; }
      }
      el.cartList.appendChild(cartRow(item, cart[id], {
        week: tag,
        buttons: moveButtons(id).concat([
          { cls:'buy', text:'✓', title:'구매 완료로 옮기기', onClick:function(){ buyFromCart(id); } },
          { cls:'del', text:'×', title:'빼기', onClick:function(){ setQty(id, 0); } }
        ])
      }));
    });
  }

  function renderCartWeekly(sched){
    var frag = el.cartList;
    // 지난 주차 요약
    if (settings.currentWeek > 1 || spentCoins() > 0) {
      var past = document.createElement('p');
      past.className = 'past-note';
      past.textContent = settings.currentWeek + '주차까지 받은 ' + fmt(nowCoins()) + ' · 이미 사용 ' + fmt(spentCoins()) +
        ' → 남은 ' + signed(sched.carry);
      frag.appendChild(past);
    }

    var gapRun = [];   // 살 게 없는 주차를 모아서 한 줄로
    function flushGap(){
      if (!gapRun.length) return;
      var g = document.createElement('p');
      g.className = 'wk-gap';
      var a = gapRun[0].week, b = gapRun[gapRun.length - 1].week;
      g.textContent = (a === b ? a + '주차' : a + '~' + b + '주차') + ' · 모으는 중 (+' + fmt(settings.perWeek * gapRun.length) + ') → ' + fmt(gapRun[gapRun.length - 1].left);
      frag.appendChild(g);
      gapRun = [];
    }

    sched.weeks.forEach(function(w, idx){
      var isNow = idx === 0;
      if (!isNow && !w.items.length) { gapRun.push(w); return; }
      flushGap();
      var box = document.createElement('div');
      box.className = 'wk' + (isNow ? ' now' : '');
      var head = document.createElement('div');
      head.className = 'wk-head';
      head.innerHTML = '<span>' + w.week + '주차</span>' + (isNow ? '<span class="wk-tag">이번 주</span>' : '') +
        '<span class="wk-avail">' + (isNow ? '쓸 수 있는 <b>' + signed(w.start) + '</b>' : '+' + fmt(settings.perWeek) + ' → <b>' + fmt(w.start) + '</b>') + '</span>';
      box.appendChild(head);
      if (!w.items.length) {
        var e = document.createElement('p');
        e.className = 'cart-empty';
        e.textContent = w.start < 0 ? '이미 쓴 코인이 받은 코인보다 많습니다. 설정을 확인해 주세요.' : '이번 주에 살 수 있는 품목이 없습니다. 다음 주로 넘깁니다.';
        box.appendChild(e);
      }
      w.items.forEach(function(en){
        var item = BY_ID[en.id];
        var partial = en.qty < cart[en.id];
        box.appendChild(cartRow(item, en.qty, {
          part: partial ? '(' + fmt(cart[en.id]) + '개 중)' : '',
          buttons: moveButtons(en.id).concat([
            { cls:'buy', text:'✓', title:isNow ? '이만큼 샀어요' : '구매 완료로 옮기기', onClick:function(){ buyFromCart(en.id, en.qty); } },
            { cls:'del', text:'×', title:'빼기', onClick:function(){ setQty(en.id, 0); } }
          ])
        }));
      });
      var foot = document.createElement('div');
      foot.className = 'wk-foot';
      foot.innerHTML = '남음 <b>' + signed(w.left) + '</b>' + (idx < sched.weeks.length - 1 ? ' → 이월' : '');
      if (isNow && w.items.length) {
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'link-btn';
        b.textContent = '이번 주 것 전부 구매 처리';
        b.addEventListener('click', function(){
          w.items.forEach(function(en){
            var q = Math.min(cart[en.id] || 0, en.qty);
            if (!q) return;
            owned[en.id] = Math.min(BY_ID[en.id].stock, (owned[en.id] || 0) + q);
            if (cart[en.id] - q <= 0) delete cart[en.id]; else cart[en.id] -= q;
          });
          save();
          render();
        });
        foot.appendChild(b);
      }
      box.appendChild(foot);
      frag.appendChild(box);
    });
    flushGap();

    var lastWeek = sched.weeks[sched.weeks.length - 1].week;
    if (!sched.over.items.length && lastWeek < settings.weeks) {
      var rest = document.createElement('p');
      rest.className = 'wk-gap';
      rest.textContent = (lastWeek + 1 === settings.weeks ? settings.weeks + '주차' : (lastWeek + 1) + '~' + settings.weeks + '주차') +
        ' · 계획 없음 (+' + fmt(settings.perWeek * (settings.weeks - lastWeek)) + ' 더 들어옴)';
      frag.appendChild(rest);
    }

    if (sched.over.items.length) {
      var ob = document.createElement('div');
      ob.className = 'wk over';
      ob.innerHTML = '<div class="wk-head"><span>기간 초과</span><span class="wk-avail">' + settings.weeks + '주 안에는 못 삽니다</span></div>';
      sched.over.items.forEach(function(en){
        var item = BY_ID[en.id];
        var partial = en.qty < cart[en.id];
        ob.appendChild(cartRow(item, en.qty, {
          part: partial ? '(' + fmt(cart[en.id]) + '개 중)' : '',
          buttons: moveButtons(en.id).concat([
            { cls:'del', text:'×', title:'빼기', onClick:function(){ setQty(en.id, 0); } }
          ])
        }));
      });
      var of = document.createElement('div');
      of.className = 'wk-foot';
      of.innerHTML = '전체 예산에서 <b>' + fmt(sched.shortfall) + '</b> 부족 · 순서를 올리거나 다른 품목을 줄여 보세요';
      ob.appendChild(of);
      frag.appendChild(ob);
    }
  }

  function renderCart(sched){
    var ids = Object.keys(cart);
    el.cartList.innerHTML = '';
    Array.prototype.forEach.call(el.cartViewTabs.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.dataset.view === view.cartView);
    });
    if (!ids.length) {
      el.planNote.classList.add('hidden');
      el.cartList.innerHTML = '<p class="cart-empty">아직 담은 아이템이 없습니다. 상점에서 아이콘을 누르거나 +로 담아보세요.</p>' +
        (Object.keys(owned).length ? '' : '<p class="cart-empty">이벤트 중간부터 쓰신다면 상점의 <b>이미 산 것 입력</b>으로 먼저 산 개수를 적어 두세요.</p>');
      el.cartSum.textContent = '';
    } else {
      el.planNote.classList.toggle('hidden', ids.length < 2);
      el.planNote.textContent = view.cartView === 'weekly'
        ? '위에 있는 품목부터 삽니다. ▲▼로 순서를 바꾸면 계획이 다시 짜집니다.'
        : '위에 있는 품목부터 산다고 보고 살 수 있는 주차를 표시합니다. ▲▼로 순서를 바꿉니다.';
      if (view.cartView === 'weekly') renderCartWeekly(sched); else renderCartList(ids);
      el.cartSum.innerHTML = fmt(ids.length) + '종 ' + fmt(countOf(cart)) + '개<b>' + fmt(usedCoins()) + '</b>';
    }

    var ownedIds = Object.keys(owned);
    el.ownedList.innerHTML = '';
    ownedIds.forEach(function(id){
      el.ownedList.appendChild(cartRow(BY_ID[id], owned[id], {
        cls:'is-owned',
        buttons: [{ cls:'del', text:'×', title:'구매 기록 지우기', onClick:function(){ setOwned(id, 0); } }]
      }));
    });
    el.ownedSum.innerHTML = ownedIds.length ? fmt(ownedIds.length) + '종 ' + fmt(countOf(owned)) + '개<b>' + fmt(coinsOf(owned)) + '</b>' : '';
    el.ownedCard.classList.toggle('hidden', !ownedIds.length);
  }

  function render(){
    document.body.classList.toggle('own-edit-on', view.ownedEdit);
    el.ownedEditBtn.classList.toggle('mode-on', view.ownedEdit);
    el.ownedEditBtn.setAttribute('aria-pressed', String(view.ownedEdit));
    el.ownedEditBtn.textContent = view.ownedEdit ? '입력 완료' : '이미 산 것 입력';
    el.onlyPickedBtn.classList.toggle('active', view.onlyPicked);
    el.onlyPickedBtn.setAttribute('aria-pressed', String(view.onlyPicked));
    el.shopHint.innerHTML = view.ownedEdit
      ? '<b>이미 산 개수를 입력하는 중입니다.</b> 게임에서 이미 산 품목의 개수를 초록 칸에 적어 주세요. ' +
        '이벤트 중간부터 계산기를 쓰거나 기록을 고칠 때 씁니다. 적은 만큼 구매 한도가 줄고 "이미 사용" 코인에 잡힙니다. ' +
        '다 적었으면 <b>입력 완료</b>를 누르세요.'
      : '아이콘을 누르면 1개씩 담깁니다. <b>최대</b>는 구매 제한(ID당·월드당)까지, <b>이번 주</b>는 이번 주 남은 코인으로 살 수 있는 만큼 담습니다.';

    Array.prototype.forEach.call(document.querySelectorAll('.item-row'), refreshRow);
    TABS.forEach(function(t){
      var tab = t.key;
      var list = listOf[tab];
      var empty = list.querySelector('.shop-empty');
      var anyVisible = SHOP[tab].some(function(it){ return !view.onlyPicked || cart[it.id]; });
      if (!anyVisible && !empty) {
        empty = document.createElement('p');
        empty.className = 'shop-empty';
        empty.textContent = '이 탭에는 담은 아이템이 없습니다.';
        list.appendChild(empty);
      } else if (anyVisible && empty) {
        empty.remove();
      }
    });

    var total = totalCoins();
    var spent = spentCoins();
    var used = usedCoins();
    var remain = total - spent - used;

    // 현재 주차까지 받은 코인에서 이미 쓴 걸 빼면 "지금 실제로 쓸 수 있는 코인"
    var nowAvailable = nowCoins() - spent;
    var shortNow = used - nowAvailable;           // 지금 기준 모자란 코인
    el.nowLabel.textContent = '지금 보유';
    el.nowLabel.title = settings.currentWeek + '주차까지 받은 코인에서 이미 쓴 것을 뺀 값';
    el.nowCoin.textContent = signed(nowAvailable);

    // 주차별 계획에서 이번 주 칸에 남는 코인 = 계획대로 사고도 이번 주에 더 쓸 수 있는 코인
    var sched = buildSchedule();
    var nowLeft = nowLeftCoins();
    el.remainLabel.textContent = '전체 남은 코인 (' + settings.weeks + '주)';
    el.remainOf.textContent = '/ ' + fmt(total);
    el.nowLeftBig.textContent = signed(nowLeft);
    el.nowLeftBig.classList.toggle('over', nowLeft < 0);
    el.nowLeftOf.textContent = '/ ' + fmt(nowCoins());
    el.nowLeftOf.title = settings.currentWeek + '주차까지 받은 코인';

    el.spentCoin.textContent = fmt(spent);
    el.usedCoin.textContent = fmt(used);

    el.remainBig.textContent = signed(remain);
    el.remainBig.classList.toggle('over', remain < 0);
    el.remainBig.classList.toggle('ok', remain >= 0);

    var pctOf = function(v){ return total > 0 ? Math.min(100, v / total * 100) : (v > 0 ? 100 : 0); };
    var ownedPct = pctOf(spent);
    el.barOwned.style.width = ownedPct + '%';
    el.barCart.style.width = Math.max(0, Math.min(100 - ownedPct, pctOf(used))) + '%';
    el.barNow.style.left = pctOf(nowCoins()) + '%';
    el.bar.classList.toggle('over', remain < 0);
    el.progressNote.textContent = remain < 0
      ? '코인이 ' + fmt(-remain) + '개 부족합니다. 장바구니에서 ' + fmt(-remain) + '개어치를 빼야 예산에 맞습니다.'
      : '총 ' + fmt(total) + '개 중 ' + fmt(spent + used) + '개 사용 (' +
        (total > 0 ? ((spent + used) / total * 100).toFixed(1) : '0.0') + '%)';

    // 코인은 매주 들어오므로, 현재 주차 보유분으로 살 수 있는지 / 몇 주차까지 모아야 하는지
    var mbWeekText = '', mbWeekCls = '';
    if (used > 0 && settings.perWeek > 0) {
      var needWeek = weekFor(spent + used);
      el.weekNote.classList.remove('hidden');
      el.weekNote.classList.toggle('warn', needWeek > settings.weeks);
      el.weekNote.classList.toggle('good', shortNow <= 0);
      if (shortNow <= 0) {
        el.weekNote.textContent = settings.currentWeek + '주차 코인으로 지금 바로 전부 살 수 있습니다.';
        mbWeekText = '지금 전부 구매 가능'; mbWeekCls = 'good';
      } else if (needWeek <= settings.weeks) {
        el.weekNote.textContent = '지금은 ' + fmt(shortNow) + '개 부족합니다. ' + needWeek + '주차 코인까지 모으면 전부 살 수 있습니다.';
        mbWeekText = needWeek + '주차까지 모으면 가능';
      } else {
        el.weekNote.textContent = '기간(' + settings.weeks + '주) 안에는 다 못 삽니다. ' + needWeek + '주차 분량의 코인이 필요합니다.';
        mbWeekText = '기간 내 불가 (' + needWeek + '주차 필요)'; mbWeekCls = 'warn';
      }
    } else {
      el.weekNote.classList.add('hidden');
    }

    // 모바일 하단 바
    el.mbRemain.textContent = signed(remain);
    el.mbRemain.classList.toggle('over', remain < 0);
    el.mbRemain.classList.toggle('ok', remain >= 0);
    el.mbCart.innerHTML = '이번 주 더 쓸 수 있는 <b>' + signed(nowLeft) + '</b>';
    el.mbWeek.textContent = mbWeekText;
    el.mbWeek.className = 'mb-week' + (mbWeekCls ? ' ' + mbWeekCls : '');

    el.buyAllBtn.disabled = used === 0;
    el.clearBtn.disabled = used === 0;
    el.resetOwnedBtn.disabled = Object.keys(owned).length === 0;
    disarm(el.clearBtn); disarm(el.resetOwnedBtn);

    TABS.forEach(function(t){
      var picked = SHOP[t.key].filter(function(it){ return cart[it.id]; }).length;
      cntOf[t.key].textContent = picked ? '(' + picked + ')' : '';
    });

    renderCart(sched);
  }

  function renderBudgetNote(){
    el.budgetNote.textContent =
      fmt(settings.perWeek) + ' × ' + settings.weeks + '주 = ' + fmt(totalCoins()) + ' 코인' +
      ' · ' + settings.currentWeek + '주차까지 ' + fmt(nowCoins()) + ' 코인';
  }

  function renderWeekPills(){
    el.weekPills.innerHTML = '';
    for (var w = 1; w <= settings.weeks; w++) {
      (function(week){
        var b = document.createElement('button');
        b.type = 'button';
        b.className = 'week-pill' + (week === settings.currentWeek ? ' active' : '');
        b.textContent = week;
        b.setAttribute('role', 'radio');
        b.setAttribute('aria-checked', String(week === settings.currentWeek));
        b.setAttribute('aria-label', week + '주차');
        b.addEventListener('click', function(){
          settings.currentWeek = week;
          save();
          renderWeekPills();
          renderBudgetNote();
          render();
        });
        el.weekPills.appendChild(b);
      })(w);
    }
  }

  function readSettings(){
    settings.perWeek = Math.max(0, parseInt(el.perWeek.value, 10) || 0);
    settings.weeks = Math.max(1, parseInt(el.weeks.value, 10) || 1);
    settings.currentWeek = clamp(settings.currentWeek, 1, settings.weeks);
    settings.extraSpent = Math.max(0, parseInt(el.extraSpent.value, 10) || 0);
    save();
    renderWeekPills();
    renderBudgetNote();
    render();
  }

  function switchTab(tab){
    activeTab = tab;
    TABS.forEach(function(t){ listOf[t.key].classList.toggle('hidden', t.key !== tab); });
    Array.prototype.forEach.call(el.shopTabs.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    save();
  }

  // 되돌릴 수 없는 버튼: 첫 클릭은 "정말?"로 바꾸고, 3초 안에 한 번 더 눌러야 실행
  function disarm(btn){
    if (!btn.dataset.label) return;
    btn.classList.remove('armed');
    btn.textContent = btn.dataset.label;
    clearTimeout(btn._armTimer);
  }
  function confirmClick(btn, armedLabel, fn){
    btn.dataset.label = btn.textContent;
    btn.addEventListener('click', function(){
      if (btn.classList.contains('armed')) { disarm(btn); fn(); return; }
      btn.classList.add('armed');
      btn.textContent = armedLabel;
      btn._armTimer = setTimeout(function(){ disarm(btn); }, 3000);
    });
  }

  // ---- 초기화 ----
  load();
  buildShop();
  el.eventSub.textContent = EVENT.name + ' · ' + EVENT.season + ' · ' + EVENT.updatedAt + ' 기준. 담으면 주차별로 언제 살 수 있는지 바로 보여줍니다.';
  el.perWeek.value = settings.perWeek;
  el.weeks.value = settings.weeks;
  el.extraSpent.value = settings.extraSpent;

  ['perWeek','weeks','extraSpent'].forEach(function(k){
    el[k].addEventListener('input', readSettings);
  });
  el.shopTabs.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tab]');
    if (btn) switchTab(btn.dataset.tab);
  });
  el.onlyPickedBtn.addEventListener('click', function(){ view.onlyPicked = !view.onlyPicked; render(); });
  el.cartViewTabs.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-view]');
    if (!btn) return;
    view.cartView = btn.dataset.view;
    save();
    render();
  });
  el.ownedEditBtn.addEventListener('click', function(){ view.ownedEdit = !view.ownedEdit; render(); });
  el.ownedEditLink.addEventListener('click', function(){
    view.ownedEdit = true;
    render();
    el.ownedEditBtn.scrollIntoView({ behavior:'smooth', block:'center' });
  });

  confirmClick(el.clearBtn, '정말 비울까요?', function(){
    cart = {};
    save();
    render();
  });
  // 실제로 사고 나면 장바구니를 그대로 "구매 완료"로 옮긴다
  // 구매 기록은 나중에 고칠 수 있으니 확인 없이 바로 옮긴다
  el.buyAllBtn.addEventListener('click', function(){
    Object.keys(cart).forEach(function(id){
      owned[id] = Math.min(BY_ID[id].stock, (owned[id] || 0) + cart[id]);
    });
    cart = {};
    save();
    render();
  });
  confirmClick(el.resetOwnedBtn, '정말 지울까요?', function(){
    owned = {};
    save();
    render();
  });

  function jumpToSummary(){ el.summaryCard.scrollIntoView({ behavior:'smooth', block:'start' }); }
  el.mobileBar.addEventListener('click', jumpToSummary);
  el.mobileBar.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); jumpToSummary(); } });

  switchTab(activeTab);
  renderWeekPills();
  renderBudgetNote();
  render();
})();
</script>
</body>
</html>
