<style>
  :root{ --surface-2:#1d212b; }

  /* 강화 / 성장 상점 탭 */
  .shop-tabs{ display:inline-flex; background:#1d212b; border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; margin-bottom:14px; }
  .shop-tabs button{
    border:none; background:none; color:var(--text-dim);
    font:inherit; font-size:0.85rem; font-weight:700;
    padding:8px 18px; border-radius:8px; cursor:pointer;
  }
  .shop-tabs button:hover{ color:var(--text); }
  .shop-tabs button.active{ background:var(--accent-strong); color:#0b0d12; }
  .shop-tabs .tab-count{ font-weight:800; margin-left:6px; opacity:.85; }

  /* 아이템 행 — 아이콘(줄 전체) · 제목+수량 · 구매 컨트롤 */
  .item-list{ display:flex; flex-direction:column; gap:10px; }
  .item-row{
    display:grid;
    grid-template-columns:auto minmax(0,1fr) auto;
    align-items:stretch;
    gap:14px;
    background:#11141a;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px;
  }
  .item-row.picked{ border-color:var(--accent-strong); background:#1c2740; }
  .item-row.maxed{ border-color:var(--good); }
  .item-row.done{ border-color:var(--good); background:rgba(76,175,125,.06); }

  /* 아이콘 — 줄 높이를 다 쓰고, 누르면 1개 담긴다 */
  .item-icon{
    display:flex; align-items:center; justify-content:center; gap:4px;
    width:78px; padding:6px;
    background:#1d212b; border:1px solid var(--border); border-radius:10px;
    color:var(--text); font:inherit; font-size:32px; line-height:1; cursor:pointer;
  }
  .item-icon:hover{ border-color:var(--accent); }
  .item-row.picked .item-icon{ border-color:var(--accent-strong); background:#1a2135; }
  .item-icon img{ width:48px; height:48px; object-fit:contain; image-rendering:pixelated; }
  /* 선택권처럼 고를 수 있는 아이템이 둘이면 아이콘 두 개를 나란히 */
  .item-icon.pair img{ width:34px; height:34px; }

  /* 가운데: 제목 + 수량 칸 */
  .item-body{ display:flex; flex-direction:column; justify-content:center; gap:8px; min-width:0; }
  .item-name{ font-size:1rem; font-weight:700; line-height:1.3; word-break:keep-all; }
  .limit-tag{
    display:inline-block; min-width:15px; margin-left:6px;
    text-align:center; border-radius:4px; padding:0 4px;
    font-size:0.66rem; font-weight:800;
    background:rgba(110,168,254,.15); color:var(--accent);
  }
  .limit-tag.w{ background:rgba(76,175,125,.15); color:var(--good); }
  .item-meta{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
  .meta-cell{
    display:flex; align-items:center; gap:7px;
    background:#171b23; border:1px solid var(--border); border-radius:8px;
    padding:4px 9px;
    font-size:0.72rem; font-weight:700; color:var(--text-dim);
  }
  .meta-cell b{ font-size:0.95rem; color:var(--text); font-variant-numeric:tabular-nums; }
  /* 남은 수량은 "98 / 100"처럼 최대 수량과 붙여서 보여준다 */
  .meta-cell .of-max{ margin-left:-4px; font-size:0.86rem; color:var(--text-dim); font-variant-numeric:tabular-nums; }
  .meta-cell.rest-cell.empty b{ color:var(--bad); }
  .meta-cell.own-cell b{ color:var(--good); }

  /* 오른쪽: [개당 가격 · 구매 시 가격] 한 줄 + 수량 조절 */
  .item-buy{ display:flex; flex-direction:column; align-items:flex-end; justify-content:center; gap:7px; }
  .price-line{ display:flex; align-items:baseline; gap:8px; }
  .unit-price{ font-size:1.1rem; font-weight:800; color:var(--accent); font-variant-numeric:tabular-nums; }
  .unit-price i{ font-style:normal; font-size:0.72rem; font-weight:700; color:var(--text-dim); margin-left:3px; }
  .buy-row{ display:flex; align-items:center; gap:6px; }
  .buy-total{
    font-size:0.74rem; font-weight:700; color:var(--text-dim);
    padding-left:9px; border-left:1px solid var(--border);
  }
  .buy-total b{ font-size:0.98rem; color:var(--accent-strong); font-variant-numeric:tabular-nums; margin-left:5px; }
  .buy-total.zero b{ color:var(--text-dim); }

  /* 좁은 화면에서는 구매 컨트롤을 아래로 */
  @media (max-width: 780px){
    .item-row{ grid-template-columns:auto minmax(0,1fr); }
    .item-buy{ grid-column:1/-1; align-items:stretch; }
    .buy-row{ justify-content:space-between; }
    .price-line{ justify-content:flex-end; }
  }

  /* 수량 조절 */
  .stepper{ display:flex; align-items:center; gap:5px; }
  .qty-btn{
    width:32px; height:32px; border-radius:8px;
    border:1px solid var(--border); background:#1d212b; color:var(--text);
    font-size:17px; font-weight:800; line-height:1; cursor:pointer;
  }
  .qty-btn:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .qty-btn:disabled{ opacity:.3; cursor:default; }
  .qty-input{
    width:62px; height:32px; text-align:center;
    background:#11141a; border:1px solid var(--accent-strong); border-radius:8px;
    color:var(--text); font-size:1.05rem; font-weight:800;
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .qty-input:disabled{ border-color:var(--border); opacity:.5; }
  .qty-input::-webkit-outer-spin-button, .qty-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .own-btn{
    width:22px; height:22px; border-radius:6px;
    border:1px solid var(--border); background:#1d212b; color:var(--text-dim);
    font-size:14px; font-weight:800; line-height:1; cursor:pointer;
  }
  .own-btn:hover:not(:disabled){ border-color:var(--good); color:var(--good); }
  .own-btn:disabled{ opacity:.3; cursor:default; }
  .own-count{ min-width:22px; text-align:center; }
  .max-btn{
    height:28px; padding:0 9px; border-radius:8px;
    border:1px solid var(--border); background:#1d212b; color:var(--text-dim);
    font-size:0.74rem; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .max-btn:hover:not(:disabled){ border-color:var(--good); color:var(--good); }
  .max-btn.min-btn:hover:not(:disabled){ border-color:var(--bad); color:var(--bad); }
  .max-btn:disabled{ opacity:.3; cursor:default; }
  .own-all{ height:24px; font-size:0.7rem; padding:0 7px; }

  /* 요약 */
  .coin-big{ font-size:2rem; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.15; }
  .coin-big.ok{ color:var(--good); }
  .coin-big.over{ color:var(--bad); }
  .bar{ position:relative; display:flex; height:10px; border-radius:999px; background:#11141a; border:1px solid var(--border); overflow:hidden; margin:12px 0 6px; }
  .bar span{ display:block; height:100%; transition:width .2s; }
  /* 현재 주차까지 받은 코인 위치 — 이 선을 넘으면 아직 코인이 안 모인 계획 */
  .bar .bar-now{ position:absolute; top:0; bottom:0; width:2px; background:var(--text); transition:left .2s; }
  .bar .fill-owned{ background:var(--good); }
  .bar .fill-cart{ background:var(--accent-strong); }
  .bar.over .fill-cart{ background:var(--bad); }
  .bar-legend{ display:flex; gap:12px; font-size:0.72rem; color:var(--text-dim); margin-top:2px; }
  .bar-legend i{ display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; }
  .bar-legend .k-owned i{ background:var(--good); }
  .bar-legend .k-cart i{ background:var(--accent-strong); }
  .bar-legend .k-now i{ width:2px; height:10px; border-radius:1px; background:var(--text); }
  .mini-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .mini{ background:#11141a; border:1px solid var(--border); border-radius:10px; padding:8px 10px; }
  .mini .label{ font-size:0.72rem; color:var(--text-dim); }
  .mini .value{ font-size:1rem; font-weight:700; margin-top:2px; font-variant-numeric:tabular-nums; }
  .mini-wide{ grid-column:1/-1; }
  .mini.now .value{ color:var(--accent); }
  .mini.now.short .value{ color:var(--bad); }

  /* 장바구니 */
  .cart-list{ display:flex; flex-direction:column; }
  .cart-row{ display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:8px; padding:8px 0; font-size:0.84rem; }
  .cart-row + .cart-row{ border-top:1px solid var(--border); }
  .cart-name{ min-width:0; word-break:keep-all; }
  .cart-name em{ font-style:normal; color:var(--text-dim); font-size:0.78rem; margin-left:4px; }
  .cart-cost{ color:var(--accent); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .cart-del{
    width:24px; height:24px; border-radius:50%; border:none;
    background:rgba(226,102,74,.15); color:var(--bad);
    font-size:14px; line-height:1; cursor:pointer;
  }
  .cart-row.is-owned .cart-cost{ color:var(--good); }
  .cart-empty{ color:var(--text-dim); font-size:0.84rem; }
  .cart-group{ font-size:0.74rem; color:var(--text-dim); font-weight:700; margin:10px 0 0; }
  .callout.warn{ background:rgba(226,102,74,0.1); border-color:var(--bad); }
  .btn-row{ display:flex; gap:8px; margin-top:8px; }
  .btn-row:first-of-type{ margin-top:14px; }
  .btn-row .link-btn{ flex:1; text-align:center; padding:7px 8px; }
  .btn-row .link-btn:disabled{ opacity:.35; cursor:default; border-color:var(--border); color:var(--text-dim); }
</style>

      { id:'chaos-circulator',  name:'카오스 서큘레이터',                    price:800,   stock:20,  limit:'M', icon:'⚙️' },
      { id:'black-circulator',  name:'블랙 서큘레이터',                      price:1500,  stock:10,  limit:'M', icon:'⚙️' },
      { id:'legend-circulator', name:'레전드리 서큘레이터',                  price:2000,  stock:3,   limit:'M', icon:'⚙️' },
      { id:'strawberry-farm',   name:'슈피겔라의 황금 딸기 농장 1회 입장권', price:200,   stock:5,   limit:'M', icon:'🍓' },
      { id:'extreme-growth',    name:'익스트림 성장의 비약',                 price:70,    stock:200, limit:'M', icon:'🧪' },
      { id:'growth-200-249',    name:'성장의 비약 (200~249)',                price:5000,  stock:2,   limit:'M', icon:'🧪' },
      { id:'growth-200-259',    name:'성장의 비약 (200~259)',                price:10000, stock:1,   limit:'M', icon:'🧪' },
      { id:'sol-erda',          name:'솔 에르다',                            price:8000,  stock:3,   limit:'M', icon:'🔷' }
    ]
  };
  var TAB_LABEL = { enhance:'강화', growth:'성장' };
  var ALL = SHOP.enhance.concat(SHOP.growth);
  var BY_ID = {};
  ALL.forEach(function(it){ BY_ID[it.id] = it; });

  var STORE_KEY = 'coinShopPlan.v1';
  var cart = {};                 // id -> 담아둔 수량 (앞으로 살 것)
  var owned = {};                // id -> 이미 구매한 수량
  var settings = { perWeek:5000, weeks:8, currentWeek:1, extraSpent:0 };
  var activeTab = 'enhance';

  var el = {
    perWeek: document.getElementById('perWeek'),
    weeks: document.getElementById('weeks'),
    currentWeek: document.getElementById('currentWeek'),
    extraSpent: document.getElementById('extraSpent'),
    budgetNote: document.getElementById('budgetNote'),
    listEnhance: document.getElementById('listEnhance'),
    listGrowth: document.getElementById('listGrowth'),
    tabs: document.getElementById('shopTabs'),
    cntEnhance: document.getElementById('cntEnhance'),
    cntGrowth: document.getElementById('cntGrowth'),
    remainBig: document.getElementById('remainBig'),
    bar: document.getElementById('bar'),
    barOwned: document.getElementById('barOwned'),
    barCart: document.getElementById('barCart'),
    barNow: document.getElementById('barNow'),
    nowCoin: document.getElementById('nowCoin'),
    nowLabel: document.getElementById('nowLabel'),
    totalLabel: document.getElementById('totalLabel'),
    progressNote: document.getElementById('progressNote'),
    totalCoin: document.getElementById('totalCoin'),
    spentCoin: document.getElementById('spentCoin'),
    usedCoin: document.getElementById('usedCoin'),
    pieceCount: document.getElementById('pieceCount'),
    weekNote: document.getElementById('weekNote'),
    cartList: document.getElementById('cartList'),
    ownedCard: document.getElementById('ownedCard'),
    ownedList: document.getElementById('ownedList'),
    clearBtn: document.getElementById('clearBtn'),
    buyAllBtn: document.getElementById('buyAllBtn'),
    resetOwnedBtn: document.getElementById('resetOwnedBtn')
  };

  function fmt(n){ return Math.round(n).toLocaleString('ko-KR'); }
  function clamp(v, lo, hi){ return Math.min(hi, Math.max(lo, v)); }

  function load(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      function restore(src, target, capOf){
        if (!src) return;
        Object.keys(src).forEach(function(id){
          var item = BY_ID[id];
          if (!item) return;                        // 상점 구성이 바뀌어 사라진 항목은 무시
          var q = clamp(parseInt(src[id], 10) || 0, 0, capOf(item));
          if (q > 0) target[id] = q;
        });
      }
      restore(saved && saved.owned, owned, function(item){ return item.stock; });
      restore(saved && saved.cart, cart, function(item){ return item.stock - (owned[item.id] || 0); });
      if (saved && saved.settings) {
        settings.perWeek = Math.max(0, Number(saved.settings.perWeek) || 0);
        settings.weeks = Math.max(1, Number(saved.settings.weeks) || 1);
        settings.currentWeek = clamp(Number(saved.settings.currentWeek) || 1, 1, settings.weeks);
        settings.extraSpent = Math.max(0, Number(saved.settings.extraSpent) || 0);
      }
      if (saved && TAB_LABEL[saved.tab]) activeTab = saved.tab;
    } catch (e) { /* 저장값이 깨졌으면 기본값으로 시작 */ }
  }
  function save(){
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({ cart:cart, owned:owned, settings:settings, tab:activeTab }));
    } catch (e) {}
  }

  function coinsOf(map){
    return Object.keys(map).reduce(function(sum, id){ return sum + BY_ID[id].price * map[id]; }, 0);
  }
  function totalCoins(){ return settings.perWeek * settings.weeks; }   // 기간 동안 받는 코인 전체
  function nowCoins(){ return settings.perWeek * settings.currentWeek; } // 현재 주차까지 받은 코인
  function spentCoins(){ return coinsOf(owned) + settings.extraSpent; } // 이미 쓴 코인
  function usedCoins(){ return coinsOf(cart); }                        // 장바구니에 담은 코인
  function leftToBuy(id){ return BY_ID[id].stock - (owned[id] || 0); } // 아직 살 수 있는 수량

  function setQty(id, qty){
    var q = clamp(Math.floor(qty) || 0, 0, leftToBuy(id));
    if (q === 0) delete cart[id]; else cart[id] = q;
    save();
    render();
  }

  function setOwned(id, n){
    var item = BY_ID[id];
    var q = clamp(Math.floor(n) || 0, 0, item.stock);
    if (q === 0) delete owned[id]; else owned[id] = q;
    // 이미 구매한 만큼 구매 한도가 줄어드니 장바구니 수량도 같이 깎는다
    if (cart[id] && cart[id] > item.stock - q) {
      var rest = item.stock - q;
      if (rest <= 0) delete cart[id]; else cart[id] = rest;
    }
    save();
    render();
  }

  // ---- 아이템 목록 ----
  function buildRow(item){
    var row = document.createElement('div');
    row.className = 'item-row';
    row.dataset.id = item.id;
    row.innerHTML =
      '<button type="button" class="item-icon" title="1개 담기"></button>' +
      '<div class="item-body">' +
        '<div class="item-name"></div>' +
        '<div class="item-meta">' +
          '<span class="meta-cell rest-cell">남은 수량<b class="rest">0</b><span class="of-max">/<span class="max">0</span></span></span>' +
          '<span class="meta-cell own-cell">이미 구매' +
            '<button type="button" class="own-btn own-minus">−</button>' +
            '<b class="own-count">0</b>' +
            '<button type="button" class="own-btn own-plus">+</button>' +
            '<button type="button" class="max-btn own-all">전량</button>' +
          '</span>' +
        '</div>' +
      '</div>' +
      '<div class="item-buy">' +
        '<div class="price-line">' +
          '<span class="unit-price"></span>' +
          '<span class="buy-total zero">구매 시<b>0 코인</b></span>' +
        '</div>' +
        '<div class="buy-row">' +
          '<button type="button" class="max-btn min-btn">최소</button>' +
          '<button type="button" class="qty-btn minus">−</button>' +
          '<input type="number" class="qty-input" min="0" value="0">' +
          '<button type="button" class="qty-btn plus">+</button>' +
          '<button type="button" class="max-btn max-all">최대</button>' +
        '</div>' +
      '</div>';

    // 실제 아이템 아이콘이 있으면 쓰고, 없는 항목만 이모지로 대신한다
    var iconBox = row.querySelector('.item-icon');
    if (item.img) {
      var files = [].concat(item.img);
      iconBox.classList.toggle('pair', files.length > 1);
      files.forEach(function(file){
        var img = document.createElement('img');
        img.src = 'icons/' + encodeURIComponent(file);
        img.alt = '';
        // 아이콘 파일이 없거나 깨지면 조용히 이모지로 되돌린다
        img.addEventListener('error', function(){
          iconBox.classList.remove('pair');
          iconBox.textContent = item.icon;
        });
        iconBox.appendChild(img);
      });
    } else {
      iconBox.textContent = item.icon;
    }
    var name = row.querySelector('.item-name');
    name.textContent = item.name;
    var tag = document.createElement('span');
    tag.className = 'limit-tag' + (item.limit === 'W' ? ' w' : '');
    tag.textContent = item.limit;
    tag.title = item.limit === 'W' ? '월드 기준 구매 제한' : '메이플ID 기준 구매 제한';
    name.appendChild(tag);
    row.querySelector('.unit-price').innerHTML = fmt(item.price) + '<i>코인</i>';
    row.querySelector('.max').textContent = fmt(item.stock);

    row.querySelector('.item-icon').addEventListener('click', function(){
      setQty(item.id, (cart[item.id] || 0) + 1);
    });
    row.querySelector('.plus').addEventListener('click', function(){
      setQty(item.id, (cart[item.id] || 0) + 1);
    });
    row.querySelector('.minus').addEventListener('click', function(){
      setQty(item.id, (cart[item.id] || 0) - 1);
    });
    row.querySelector('.min-btn').addEventListener('click', function(){
      setQty(item.id, 0);
    });
    row.querySelector('.max-all').addEventListener('click', function(){
      setQty(item.id, leftToBuy(item.id));
    });
    row.querySelector('.own-plus').addEventListener('click', function(){
      setOwned(item.id, (owned[item.id] || 0) + 1);
    });
    row.querySelector('.own-minus').addEventListener('click', function(){
      setOwned(item.id, (owned[item.id] || 0) - 1);
    });
    row.querySelector('.own-all').addEventListener('click', function(){
      // 이미 전량 구매 상태면 한 번 더 누를 때 취소되게
      setOwned(item.id, (owned[item.id] || 0) === item.stock ? 0 : item.stock);
    });
    var input = row.querySelector('.qty-input');
    input.addEventListener('input', function(){ setQty(item.id, parseInt(input.value, 10)); });
    input.addEventListener('focus', function(){ input.select(); });
    return row;
  }

  function buildList(container, items){
    items.forEach(function(item){ container.appendChild(buildRow(item)); });
  }

  function refreshRow(row){
    var item = BY_ID[row.dataset.id];
    var qty = cart[item.id] || 0;
    var own = owned[item.id] || 0;
    var buyable = item.stock - own;          // 아직 살 수 있는 수량
    var done = own >= item.stock;            // 전량 구매 완료

    row.classList.toggle('picked', qty > 0);
    row.classList.toggle('maxed', qty > 0 && qty === buyable);
    row.classList.toggle('owned', own > 0);
    row.classList.toggle('done', done);
    row.querySelector('.rest').textContent = fmt(buyable - qty);
    row.querySelector('.rest-cell').classList.toggle('empty', buyable - qty === 0);

    var total = row.querySelector('.buy-total');
    total.innerHTML = '구매 시<b>' + fmt(item.price * qty) + ' 코인</b>';
    total.classList.toggle('zero', qty === 0);

    var input = row.querySelector('.qty-input');
    input.max = buyable;
    // 입력 중인 칸은 건드리지 않는다 (커서가 튀지 않게)
    if (document.activeElement !== input) input.value = String(qty);
    input.disabled = done;
    row.querySelector('.minus').disabled = qty <= 0;
    row.querySelector('.plus').disabled = qty >= buyable;
    row.querySelector('.min-btn').disabled = qty <= 0;
    row.querySelector('.max-all').disabled = done || qty >= buyable;

    row.querySelector('.own-count').textContent = fmt(own);
    row.querySelector('.own-minus').disabled = own <= 0;
    row.querySelector('.own-plus').disabled = own >= item.stock;
    row.querySelector('.own-all').textContent = done ? '취소' : '전량';
  }

  // ---- 장바구니 / 요약 ----
  function appendCartRows(container, map, onDelete, extraClass){
    var any = false;
    ['enhance','growth'].forEach(function(tab){
      var picked = SHOP[tab].filter(function(it){ return map[it.id]; });
      if (!picked.length) return;
      any = true;
      var head = document.createElement('p');
      head.className = 'cart-group';
      head.textContent = TAB_LABEL[tab];
      container.appendChild(head);
      picked.forEach(function(item){
        var qty = map[item.id];
        var row = document.createElement('div');
        row.className = 'cart-row' + (extraClass ? ' ' + extraClass : '');
        row.innerHTML = '<span class="cart-name"></span>' +
                        '<span class="cart-cost"></span>' +
                        '<button type="button" class="cart-del" title="빼기">×</button>';
        var name = row.querySelector('.cart-name');
        name.textContent = item.name;
        var em = document.createElement('em');
        em.textContent = '×' + fmt(qty);
        name.appendChild(em);
        row.querySelector('.cart-cost').textContent = fmt(item.price * qty);
        row.querySelector('.cart-del').addEventListener('click', function(){ onDelete(item.id); });
        container.appendChild(row);
      });
    });
    return any;
  }

  function renderCart(){
    el.cartList.innerHTML = '';
    var any = appendCartRows(el.cartList, cart, function(id){ setQty(id, 0); });
    if (!any) {
      el.cartList.innerHTML = '<p class="cart-empty">아직 담은 아이템이 없습니다. 왼쪽 상점에서 아이템을 클릭해보세요.</p>';
    }

    el.ownedList.innerHTML = '';
    var hasOwned = appendCartRows(el.ownedList, owned, function(id){ setOwned(id, 0); }, 'is-owned');
    el.ownedCard.classList.toggle('hidden', !hasOwned);
  }

  function render(){
    Array.prototype.forEach.call(document.querySelectorAll('.item-row'), refreshRow);

    var total = totalCoins();
    var spent = spentCoins();
    var used = usedCoins();
    var remain = total - spent - used;
    var pieces = Object.keys(cart).reduce(function(s, id){ return s + cart[id]; }, 0);

    // 현재 주차까지 받은 코인에서 이미 쓴 걸 빼면 "지금 실제로 쓸 수 있는 코인"
    var nowAvailable = nowCoins() - spent;
    el.nowLabel.textContent = '지금 보유 (' + settings.currentWeek + '주차)';
    el.totalLabel.textContent = '총 획득 (' + settings.weeks + '주)';
    el.nowCoin.textContent = (nowAvailable < 0 ? '−' : '') + fmt(Math.abs(nowAvailable));
    el.nowCoin.parentNode.classList.add('now');
    el.nowCoin.parentNode.classList.toggle('short', nowAvailable - used < 0);

    el.totalCoin.textContent = fmt(total);
    el.spentCoin.textContent = fmt(spent);
    el.usedCoin.textContent = fmt(used);
    el.pieceCount.textContent = fmt(Object.keys(cart).length) + '종 ' + fmt(pieces) + '개';

    el.remainBig.textContent = (remain < 0 ? '−' : '') + fmt(Math.abs(remain));
    el.remainBig.classList.toggle('over', remain < 0);
    el.remainBig.classList.toggle('ok', remain >= 0);

    var pctOf = function(v){ return total > 0 ? Math.min(100, v / total * 100) : (v > 0 ? 100 : 0); };
    var ownedPct = pctOf(spent);
    el.barOwned.style.width = ownedPct + '%';
    el.barCart.style.width = Math.max(0, Math.min(100 - ownedPct, pctOf(used))) + '%';
    el.barNow.style.left = pctOf(nowCoins()) + '%';
    el.bar.classList.toggle('over', remain < 0);
    el.progressNote.textContent = remain < 0
      ? '코인이 ' + fmt(-remain) + '개 부족합니다.'
      : '총 ' + fmt(total) + '개 중 ' + fmt(spent + used) + '개 사용 (' +
        (total > 0 ? ((spent + used) / total * 100).toFixed(1) : '0.0') + '%)';

    // 코인은 매주 들어오므로, 현재 주차 보유분으로 살 수 있는지 / 몇 주차까지 모아야 하는지
    if (used > 0 && settings.perWeek > 0) {
      var short = used - nowAvailable;             // 지금 기준 모자란 코인
      var needWeek = Math.ceil((spent + used) / settings.perWeek);
      el.weekNote.classList.remove('hidden');
      el.weekNote.classList.toggle('warn', short > 0);
      if (short <= 0) {
        el.weekNote.textContent = settings.currentWeek + '주차 코인으로 지금 바로 전부 살 수 있습니다.';
      } else if (needWeek <= settings.weeks) {
        el.weekNote.textContent = '지금은 ' + fmt(short) + '개 부족 — ' + needWeek + '주차 코인까지 모으면 전부 살 수 있습니다.';
      } else {
        el.weekNote.textContent = '기간(' + settings.weeks + '주) 안에는 다 못 삽니다. ' + needWeek + '주차 분량의 코인이 필요합니다.';
      }
    } else {
      el.weekNote.classList.add('hidden');
    }

    el.buyAllBtn.disabled = used === 0;
    el.resetOwnedBtn.disabled = Object.keys(owned).length === 0;

    var pickedEnhance = SHOP.enhance.filter(function(it){ return cart[it.id]; }).length;
    var pickedGrowth = SHOP.growth.filter(function(it){ return cart[it.id]; }).length;
    el.cntEnhance.textContent = pickedEnhance ? '(' + pickedEnhance + ')' : '';
    el.cntGrowth.textContent = pickedGrowth ? '(' + pickedGrowth + ')' : '';

    renderCart();
  }

  function renderBudgetNote(){
    el.budgetNote.textContent =
      fmt(settings.perWeek) + ' × ' + settings.weeks + '주 = ' + fmt(totalCoins()) + ' 코인' +
      ' · ' + settings.currentWeek + '주차까지 ' + fmt(nowCoins()) + ' 코인';
  }

  function readSettings(){
    settings.perWeek = Math.max(0, parseInt(el.perWeek.value, 10) || 0);
    settings.weeks = Math.max(1, parseInt(el.weeks.value, 10) || 1);
    settings.currentWeek = clamp(parseInt(el.currentWeek.value, 10) || 1, 1, settings.weeks);
    settings.extraSpent = Math.max(0, parseInt(el.extraSpent.value, 10) || 0);
    // 기간을 줄이면 현재 주차도 따라 줄어드니 입력칸에 되돌려 적어준다
    el.currentWeek.max = settings.weeks;
    if (document.activeElement !== el.currentWeek) el.currentWeek.value = settings.currentWeek;
    save();
    renderBudgetNote();
    render();
  }

  function switchTab(tab){
    activeTab = tab;
    el.listEnhance.classList.toggle('hidden', tab !== 'enhance');
    el.listGrowth.classList.toggle('hidden', tab !== 'growth');
    Array.prototype.forEach.call(el.tabs.querySelectorAll('button'), function(b){
      b.classList.toggle('active', b.dataset.tab === tab);
    });
    save();
  }

  // ---- 초기화 ----
  load();
  buildList(el.listEnhance, SHOP.enhance);
  buildList(el.listGrowth, SHOP.growth);
  el.perWeek.value = settings.perWeek;
  el.weeks.value = settings.weeks;
  el.currentWeek.value = settings.currentWeek;
  el.currentWeek.max = settings.weeks;
  el.extraSpent.value = settings.extraSpent;

  ['perWeek','weeks','currentWeek','extraSpent'].forEach(function(k){
    el[k].addEventListener('input', readSettings);
  });
  el.tabs.addEventListener('click', function(e){
    var btn = e.target.closest('button[data-tab]');
    if (btn) switchTab(btn.dataset.tab);
  });
  el.clearBtn.addEventListener('click', function(){
    cart = {};
    save();
    render();
  });
  // 실제로 사고 나면 장바구니를 그대로 "구매 완료"로 옮긴다
  el.buyAllBtn.addEventListener('click', function(){
    Object.keys(cart).forEach(function(id){
      owned[id] = Math.min(BY_ID[id].stock, (owned[id] || 0) + cart[id]);
    });
    cart = {};
    save();
    render();
  });
  el.resetOwnedBtn.addEventListener('click', function(){
    owned = {};
    save();
    render();
  });

  switchTab(activeTab);
  renderBudgetNote();
  render();
})();
</script>
</body>
</html>
