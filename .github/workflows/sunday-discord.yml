name: 썬데이 메이플 디스코드 알림

on:
  # 정기 알림은 cloudflare/sunday-discord/wrangler.jsonc에서 관리한다.
  # GitHub에는 필요 시 실행하는 수동 테스트만 남긴다.
  workflow_dispatch:
    inputs:
      test:
        description: '테스트 발송 (날짜와 상관없이 가장 최근 공지를 바로 보냄)'
        type: boolean
        default: true

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sunday_discord.cjs
        env:
          NEXON_API_KEY: ${{ secrets.MAPLE_API }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DDUSCIRD_WEBHHOK_URL }}
          SUNDAY_TEST: ${{ inputs.test && '1' || '' }}
