<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>공용 환산 배율</title><link rel="icon" type="image/webp" href="icons/home/메이프릴카메라.webp">
  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site_ux.css"><link rel="stylesheet" href="boss_workspace.css"><link rel="stylesheet" href="shared_boss_rates.css"><link rel="stylesheet" href="boss_identity.css"><link rel="stylesheet" href="boss_difficulty.css">
  <script src="site_header.js" defer></script><script src="site_nav.js" defer></script><script src="site_help_data.js" defer></script>
<script src="site_help.js" defer></script>
<script src="site_ux.js" defer></script>
  <script src="boss_db.js" defer></script><script src="scouter_data.js" defer></script><script src="rate_catalog.js" defer></script><script src="account_catalog.js" defer></script>
  <script src="nexon_key.js" defer></script><script src="nexon_api.js" defer></script><script src="nexon_characters.js" defer></script><script src="character_profile.js" defer></script><script src="boss_identity.js" defer></script>
  <script src="boss_shot_reader.js?v=2" defer></script><script src="shared_boss_rates.js" defer></script>
</head>
<body><main class="wrap boss-app shared-wrap">
  <div data-site-navigation></div>
  <header><h1>공용 환산 배율</h1><p class="sub">캐릭터별 배율을 등록하고 파티에서 함께 사용하세요.</p></header>
  <div class="shared-workspace">
    <aside class="card shared-sidebar">
      <div class="boss-section-head"><h2>캐릭터</h2><button id="shared-refresh" class="boss-icon-button" type="button" aria-label="캐릭터 목록 새로고침" title="새로고침">↻</button></div>
      <div class="shared-selectors"><label>계정<select id="shared-account"><option value="">전체 계정</option></select></label><label>캐릭터<select id="shared-character"><option value="">캐릭터 선택</option></select></label></div>
      <form id="shared-open" class="shared-add-character"><label class="sr-only" for="shared-nickname">새 캐릭터 닉네임</label><input id="shared-nickname" maxlength="30" placeholder="새 캐릭터 닉네임" required><button type="submit" class="boss-primary">추가</button></form>
      <details id="shared-account-editor" class="boss-details"><summary>계정 관리</summary>
        <label>관리할 계정<select id="shared-group-select"><option value=":pick" disabled selected>계정을 선택하세요</option></select></label>
        <div id="shared-group-fields" hidden>
          <label class="shared-group-name">계정 이름 (선택)<input id="shared-group-label" maxlength="40" placeholder="비우면 자동으로 지정" aria-describedby="shared-group-name-note"></label>
          <p id="shared-group-name-note" class="boss-status">이름을 비우면 가장 레벨이 높은 캐릭터의 닉네임을 사용합니다.</p>
          <fieldset class="shared-group-roster">
            <legend>소속 캐릭터</legend>
            <div id="shared-group-members" class="shared-group-members"></div>
            <p id="shared-group-empty" class="boss-status" hidden>표시할 캐릭터가 없습니다.</p>
          </fieldset>
          <fieldset class="shared-group-roster">
            <legend>캐릭터 추가</legend>
            <label class="sr-only" for="shared-group-search">닉네임으로 좁히기</label>
            <input id="shared-group-search" type="search" maxlength="30" placeholder="닉네임으로 좁히기" autocomplete="off" aria-controls="shared-group-results" aria-describedby="shared-group-search-status">
            <p id="shared-group-search-status" class="boss-status" role="status"></p>
            <div id="shared-group-results" class="shared-group-members"></div>
          </fieldset>
          <button id="shared-group-save" class="boss-primary boss-wide" type="button" disabled>공용 계정 저장</button>
          <p id="shared-group-status" class="boss-status" role="status"></p>
        </div>
      </details>
      <p id="shared-connection" class="shared-connection" role="status">연결 중…</p>
    </aside>
    <section class="card shared-panel" aria-label="캐릭터 배율">
      <div class="shared-hero"><div><div id="shared-profile"></div><p id="shared-profile-status" class="boss-status" role="status"></p></div><div class="shared-character-tools"><button id="shared-delete" class="boss-button shared-delete" type="button" hidden>캐릭터 삭제</button><a id="shared-source" class="boss-button" hidden target="_blank" rel="noopener noreferrer">환산 원문 ↗</a></div></div>
      <details id="shared-owner-settings" class="boss-details shared-owner-settings"><summary id="shared-owner-summary">계정 설정</summary><div id="shared-owner-fields" class="shared-owner-fields"><label>소속 계정<select id="shared-owner"><option value="__unassigned__">미분류</option></select></label><label>이름 · 선택<input id="shared-owner-label" maxlength="40" placeholder="비우면 자동으로 지정"></label></div></details>
      <div class="shared-input-toolbar"><div class="shared-input-toggle" role="group" aria-label="배율 입력 방식"><button id="shared-mode-capture" type="button" aria-pressed="true" aria-controls="shared-capture"><span class="site-tab-icon"><img class="site-item-icon" src="icons/home/메이프릴카메라.webp" alt=""></span>캡처 입력</button><button id="shared-mode-fetch" type="button" aria-pressed="false" aria-controls="shared-fetch-panel"><span class="site-tab-icon"><img class="site-item-icon" src="icons/home/감정돋보기.webp" alt=""></span>환산 조회</button></div><div id="shared-fetch-panel" hidden><button id="shared-fetch" class="boss-primary" type="button" disabled>배율 불러오기</button></div></div>
      <p id="shared-status" class="boss-status" role="status" aria-live="polite"></p>
      <div id="shared-capture">
        <div class="shared-capture-header">
          <button id="shared-capture-guide" class="ux-button" type="button" data-ux-help-trigger="shared-capture-guide-section"><span class="shared-guide-mark" aria-hidden="true">?</span> 캡처 등록 방법</button>
          <p class="ux-hint">보스 카드 캡처를 아래에 붙여넣으세요.</p>
        </div>
        <div id="shared-drop" class="shared-drop" tabindex="0"><span>이미지를 놓거나 Ctrl+V로 붙여넣기</span><label class="boss-button">파일 선택<input id="shared-image" type="file" accept="image/png,image/jpeg,image/webp"></label></div>
        <p id="shared-shot-status" class="boss-status" role="status"></p><div id="shared-review" class="shared-shot-unresolved"></div>
      </div>
      <div id="shared-save-bar" class="shared-save-bar"><div><h2>보스별 배율 <span id="shared-rate-count" class="boss-count"></span></h2><span id="shared-save-state" class="shared-save-state" role="status"></span></div><div><label id="shared-pin-label" hidden>기록 비밀번호<input id="shared-pin" type="password" autocomplete="current-password"></label><button id="shared-save" class="boss-primary" type="button" disabled>공용 배율 저장</button></div></div>
      <div class="shared-scroll"><table id="shared-table" hidden><thead><tr><th scope="col">보스</th><th scope="col">환산 배율</th><th scope="col"><span class="sr-only">삭제</span></th></tr></thead><tbody id="shared-rows"></tbody></table></div>
      <details class="boss-details shared-manual-add"><summary>보스 추가</summary><div class="shared-add-row"><select id="shared-add-boss" aria-label="추가할 보스와 난이도"></select><button id="shared-add" type="button" disabled>추가</button></div></details>
    </section>
  </div>
  <footer class="boss-data-credit">Data based on NEXON Open API</footer>
</main><div id="shared-toast" class="boss-toast" role="status" aria-live="polite" hidden></div></body></html>
