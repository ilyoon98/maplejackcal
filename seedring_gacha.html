<!doctype html>
<html lang="ko">
<head>

<title>시드링 뽑기 | 메이플 계산기 모음</title>
<link rel="stylesheet" href="style.css" />
<style>
  :root{--sr-jade:#55b787;--sr-ruby:#e2664a;--sr-onyx:#c3c8d6;--sr-pearl:#e8e9ec;--sr-gold:#ffd36a;--sr-faint:#7b8090;--sr-surface-2:#1d212b;}
  .sr-wrap{max-width:1280px;margin:0 auto;padding:24px 16px 80px}
  .sr-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#14251d 0%,#151d26 58%,#1b2233 100%);border:1px solid #3c6450;border-radius:22px;padding:30px 32px;margin-top:18px;box-shadow:0 18px 50px rgba(0,0,0,.24)}
  .sr-hero:after{content:"◆  ◇  ◆  ◇";position:absolute;right:26px;top:22px;color:rgba(172,232,203,.4);font-size:22px;letter-spacing:13px;transform:rotate(7deg)}
  .eyebrow{color:#9fe0c0;font-size:.75rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
  .sr-hero h1{font-size:clamp(1.9rem,4vw,3.1rem);line-height:1.08;margin:9px 0 10px;letter-spacing:-.06em}
  .sr-hero p{max-width:680px;color:#bcc6bf;margin:0;line-height:1.75}
  .sr-layout{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(340px,.88fr);gap:18px;align-items:start;margin-top:18px}
  .sr-left,.sr-right{min-width:0}.sr-right{position:sticky;top:16px}
  .sr-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-top:16px}
  .sr-card:first-child{margin-top:0}
  .sr-card h2{font-size:1.05rem;margin:0 0 5px}
  .sr-card-sub{font-size:.8rem;color:var(--text-dim);margin:0 0 14px;line-height:1.6}

  /* 뽑기 방식 탭 */
  .mode-switch{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mode-tab{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--sr-surface-2);color:var(--text-dim);cursor:pointer;font:inherit;font-size:.9rem;transition:border-color .15s,background .15s,color .15s}
  .mode-tab:hover{border-color:var(--accent);color:var(--text)}
  .mode-tab[aria-selected="true"]{color:var(--text);border-color:var(--sr-jade);background:#17281f;font-weight:700}
  .mode-tab-mark{font-size:1rem;color:var(--sr-jade)}
  .mode-description{margin:12px 0 0;font-size:.78rem;color:var(--text-dim);line-height:1.6}

  /* 상자 선택 */
  /* 상자당 한 줄. 카드가 넓어야 보스 아이콘·난이도 배지가 읽을 만한 크기로 들어간다. */
  .boxrow{display:grid;grid-template-columns:1fr;gap:10px}
  .boxcard{display:block;text-align:left;background:var(--sr-surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
  .boxcard:hover{transform:translateY(-2px);border-color:var(--card-accent,var(--accent))}
  .boxcard[aria-disabled="true"]{cursor:default}
  .boxcard[aria-disabled="true"]:hover{transform:none}
  .boxcard[aria-disabled="true"]:not([aria-pressed="true"]){opacity:.5}
  .boxcard[aria-pressed="true"]{border-color:var(--card-accent,var(--accent-strong));background:#1b2430;box-shadow:0 0 0 1px var(--card-accent,var(--accent-strong)) inset}
  .boxcard-main{display:flex;align-items:center;gap:12px}
  .box-icon-stage,.vault-box-icon,.result-icon-stage,.table-icon-stage{display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--border);border-radius:10px;background:#11141a}
  .box-icon,.vault-box-icon img,.result-icon,.table-icon{image-rendering:pixelated;object-fit:contain}
  .box-icon-stage{width:64px;height:64px}
  .box-icon{width:52px;height:48px}
  .boxcard-copy{flex:1 1 auto;min-width:0}
  .boxcard .name{display:flex;align-items:center;gap:7px;font-size:.95rem;font-weight:700}
  .box-grade{display:inline-grid;place-items:center;min-width:22px;height:19px;padding:0 6px;border-radius:999px;border:1px solid var(--card-accent,var(--box-accent,var(--accent)));color:var(--card-accent,var(--box-accent,var(--accent)));font-size:.66rem;font-weight:700;line-height:1}
  .vault-grade{margin-left:4px;vertical-align:middle}
  /* 흘려보내지 말고 격자로 세워서 열을 맞춘다. 상자 아이콘 옆이 아니라 카드 폭을 통째로
     쓰기 때문에 보통 화면에서 한 줄에 3개가 들어가고, 좁아지면 2개·1개로 줄되 열 정렬은 유지된다. */
  .boxcard .bosses{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));
    gap:9px 14px;margin-top:12px;justify-items:start;
  }
  .boss-chip{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--text-dim)}
  .boss-chip-icon{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);object-fit:cover;flex:0 0 auto}
  .boss-chip-name{white-space:nowrap}
  .boss-diff{
    display:inline-grid;place-items:center;min-width:20px;height:19px;padding:0 5px;
    border-radius:5px;background:var(--difficulty);color:#10151c;
    font-size:.68rem;font-weight:900;line-height:1;letter-spacing:.02em;
  }
  .difficulty-easy{--difficulty:#80cc8f}
  .difficulty-normal{--difficulty:#77b9ef}
  .difficulty-hard{--difficulty:#f5a360}
  .difficulty-chaos{--difficulty:#eb88b8}
  .difficulty-extreme{--difficulty:#c6a1fa}
  .daily-box-badge{display:inline-block;margin-bottom:4px;color:var(--sr-gold);font-size:.66rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
  .boxcard[data-box="jade"]{--card-accent:var(--sr-jade)}
  .boxcard[data-box="red"]{--card-accent:var(--sr-ruby)}
  .boxcard[data-box="black"]{--card-accent:var(--sr-onyx)}
  .boxcard[data-box="white"]{--card-accent:var(--sr-pearl)}
  .boxcard[data-box="life"]{--card-accent:var(--sr-gold)}

  /* 뽑기 영역 */
  .vault{text-align:center;position:relative;overflow:hidden;isolation:isolate}
  .vault-label{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim)}
  .vault-boxname{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px;font-size:1.1rem;font-weight:700}
  .vault-box-icon{width:58px;height:58px}
  .vault-box-icon img{width:46px;height:44px}
  .vault-hint{margin-top:8px;font-size:.76rem;color:var(--sr-gold)}
  .daily-status{min-height:22px;margin-top:10px;font-size:.8rem;color:var(--text-dim)}
  .daily-status.used{color:var(--sr-gold)}
  .drawbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .btn{border:1px solid var(--border);background:var(--sr-surface-2);color:var(--text);padding:11px 22px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer;transition:border-color .15s,filter .15s}
  .btn:hover:not(:disabled){border-color:var(--box-accent,var(--accent))}
  /* 뽑기 버튼은 style.css의 button.primary처럼 강조색을 꽉 채워서, 카드 배경에 묻히지 않게 한다. */
  .btn.primary{
    border-color:var(--box-accent,var(--accent-strong));
    background:var(--box-accent,var(--accent-strong));
    color:#0b0d12;font-weight:800;
  }
  .btn.primary:hover:not(:disabled){filter:brightness(1.08)}
  .btn:disabled{cursor:not-allowed}
  .btn:not(.primary):disabled{opacity:.4}
  /* 뽑기를 끝낸 상태: 꽉 찬 강조색을 빼되 글자는 읽히게 남긴다. */
  .btn.primary:disabled{background:transparent;color:var(--text-dim);border-color:var(--border)}

  /* 결과 */
  .result{margin-top:20px;min-height:24px}
  .result-card{display:inline-block;text-align:left;min-width:280px;max-width:100%;background:#11141a;border:2px solid var(--box-accent,var(--border));border-radius:14px;padding:16px 18px;position:relative;animation:reveal .38s ease}
  .result-card.jackpot{border-color:var(--sr-gold);box-shadow:0 0 40px -8px var(--sr-gold)}
  @keyframes reveal{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
  .vault.is-drawing .result-card{transform-origin:50% 90%;animation:ringCardPop .74s cubic-bezier(.18,.9,.25,1.18) both}
  .vault.is-drawing .result-icon-stage{animation:ringIconPop .68s .08s cubic-bezier(.2,.9,.25,1.25) both}
  .vault.is-drawing .result-lv{animation:ringBadgePop .58s .16s cubic-bezier(.2,.9,.25,1.2) both}
  .vault.is-drawing .result-card:after{content:"";position:absolute;inset:-2px;border-radius:14px;pointer-events:none;border:2px solid var(--box-accent,var(--accent));animation:ringCardGlow .8s ease-out both}
  @keyframes ringCardPop{0%{opacity:.15;transform:translateY(24px) scale(.82)}48%{opacity:1;transform:translateY(-10px) scale(1.045)}70%{transform:translateY(4px) scale(.985)}86%{transform:translateY(-2px) scale(1.008)}100%{transform:none}}
  @keyframes ringIconPop{0%{opacity:.2;transform:rotate(-16deg) scale(.55)}58%{opacity:1;transform:rotate(7deg) scale(1.16)}100%{transform:none}}
  @keyframes ringBadgePop{0%{opacity:0;transform:translateX(10px) scale(.7)}65%{opacity:1;transform:translateX(-2px) scale(1.08)}100%{transform:none}}
  @keyframes ringCardGlow{0%{opacity:0;box-shadow:0 0 0 var(--box-accent,var(--accent))}35%{opacity:1;box-shadow:0 0 34px var(--box-accent,var(--accent))}100%{opacity:0;box-shadow:0 0 54px transparent}}
  @keyframes ringCardReducedPop{0%{opacity:.55;transform:scale(.94)}58%{opacity:1;transform:scale(1.025)}100%{transform:none}}
  @media (prefers-reduced-motion:reduce){
    .result-card{animation:none}
    .vault.is-drawing .result-card{animation:ringCardReducedPop .55s ease-out both}
    .vault.is-drawing .result-icon-stage,.vault.is-drawing .result-lv{animation:none}
    .vault.is-drawing .result-card:after{display:none}
  }
  .jackpot-tag{display:inline-block;margin-bottom:10px;padding:4px 11px;border-radius:999px;background:var(--sr-gold);color:#241c08;font-size:.72rem;font-weight:800}
  .result-top{display:flex;align-items:center;justify-content:space-between;gap:14px}
  .result-item{display:flex;align-items:center;gap:12px;min-width:0}
  .result-icon-stage{width:58px;height:58px;border-radius:12px}
  .result-icon{width:44px;height:44px}
  .result-name{font-size:1.05rem;font-weight:700}
  .result-lv{padding:4px 13px;border:2px solid var(--box-accent,var(--accent));border-radius:999px;color:var(--box-accent,var(--accent));font-size:1rem;font-weight:800;white-space:nowrap}
  .result-lv.jackpot-lv{border-color:var(--sr-gold);color:var(--sr-gold);background:rgba(255,211,106,.12)}
  .result-prob{margin-top:10px;font-size:.78rem;color:var(--text-dim);font-variant-numeric:tabular-nums}
  .result-prob b{color:var(--text)}
  .result-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--border)}
  .copy-image-btn{padding:8px 16px;font-size:.8rem;border-color:var(--box-accent,var(--accent))}
  .share-feedback{min-height:18px;font-size:.72rem;color:var(--text-dim)}

  /* 확률표 */
  .probtoggle-btn{display:flex;align-items:center;gap:8px;padding:0;border:none;background:none;color:var(--text);font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
  .probtoggle-btn .car{font-size:.75rem;color:var(--text-dim);transition:transform .15s}
  .probtoggle-btn[aria-expanded="true"] .car{transform:rotate(90deg)}
  .probtoggle-note{margin:6px 0 0;font-size:.78rem;color:var(--text-dim);line-height:1.6}
  .probtable-wrap{margin-top:14px}
  .probtable-wrap[hidden]{display:none}
  .levelrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .levelchip{padding:5px 11px;border:1px solid var(--border);border-radius:999px;font-size:.76rem;color:var(--text-dim);font-variant-numeric:tabular-nums}
  .levelchip b{color:var(--text);font-weight:700}
  .levelchip.jackpot-lv{border-color:var(--sr-gold);color:var(--sr-gold)}
  .levelchip.jackpot-lv b{color:var(--sr-gold)}
  .tablescroll{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
  table.probtable{width:100%;border-collapse:collapse;font-size:.8rem;table-layout:fixed}
  table.probtable caption{padding:10px 12px;text-align:left;font-size:.72rem;color:var(--text-dim);border-bottom:1px solid var(--border);line-height:1.5}
  table.probtable th,table.probtable td{padding:8px 9px;text-align:left;border-bottom:1px solid var(--border)}
  /* 숫자 3칸은 폭을 고정하고 남는 폭을 전부 반지 이름 칸에 준다. 이름이 길면
     줄바꿈시켜서 표에 가로 스크롤이 생기지 않게 한다. */
  table.probtable th:first-child,table.probtable td:first-child{width:auto;min-width:0}
  table.probtable th:not(:first-child),table.probtable td:not(:first-child){width:74px;white-space:nowrap}
  table.probtable th{color:var(--text-dim);font-weight:500;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase}
  table.probtable td.num{font-variant-numeric:tabular-nums;color:var(--text-dim)}
  table.probtable td.final-prob{color:var(--text)}
  table.probtable td.final-prob.lv4{color:var(--sr-gold)}
  table.probtable td.impossible{color:var(--sr-faint)}
  table.probtable tbody tr:hover{background:var(--sr-surface-2)}
  table.probtable tr.jackpot-row td:first-child{color:var(--sr-gold);font-weight:700}
  .table-item{display:flex;align-items:center;gap:9px;min-width:0}
  .table-item>span:last-child{min-width:0;word-break:keep-all}
  .table-icon-stage{width:34px;height:34px;border-radius:8px}
  .table-icon{width:26px;height:26px}
  /* "★ Lv.4 당첨"을 이름 아래로 내려서 이름 칸이 좁아도 한 줄이 길어지지 않게 */
  .jackpot-mark{display:block;color:var(--sr-gold);font-size:.7rem;font-weight:500}
  .sr-footer{margin-top:20px;padding-top:14px;border-top:1px solid var(--border);font-size:.72rem;color:var(--text-dim);line-height:1.6}
  .sr-footer a{color:var(--accent)}

  @media(max-width:900px){
    .sr-layout{grid-template-columns:1fr}
    .sr-right{position:static}
    .sr-right>.sr-card:first-child{margin-top:16px}
  }
  @media(max-width:540px){
    .sr-hero{padding:24px 20px}.sr-hero:after{display:none}
    .vault-boxname{flex-direction:column;gap:7px}
    .drawbtns .btn{width:100%}
    .result-card{min-width:0;width:100%}
    .result-top{align-items:flex-start}
    .result-actions .btn{flex:1 1 100%}
    .share-feedback{flex-basis:100%;text-align:center}
    .tablescroll{overflow:visible;border:0;border-radius:0}
    table.probtable{display:block;min-width:0}
    table.probtable caption{display:block;margin-bottom:10px;padding:10px 12px;border:1px solid var(--border);border-radius:11px}
    table.probtable thead{display:none}
    table.probtable tbody{display:grid;gap:8px}
    table.probtable tbody tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#11141a}
    table.probtable th,table.probtable td{display:block;padding:8px;border-bottom:0;white-space:normal}
    table.probtable th:not(:first-child),table.probtable td:not(:first-child){width:auto;white-space:normal}
    table.probtable td:first-child{grid-column:1/-1;padding:10px 11px;border-bottom:1px solid var(--border)}
    table.probtable td.num{text-align:center;font-size:.72rem}
    table.probtable td.num:before{content:attr(data-label);display:block;margin-bottom:2px;color:var(--text-dim);font-size:.62rem}
  }
</style>
</head>

<main class="sr-wrap">
  <nav class="site-tabs">
    <div class="site-tabs-track">
      <span class="site-tabs-pill" aria-hidden="true"></span>

    </div>
  </nav>

  <header class="sr-hero">
    <div class="eyebrow">Seed Ring</div>
    <h1>💍 시드링 뽑기</h1>
  </header>

  <div class="sr-layout">
    <section class="sr-left">
      <section class="sr-card">
        <h2>뽑기 방식</h2>
        <div class="mode-switch" role="tablist" aria-label="뽑기 방식 선택">
          <button class="mode-tab" id="modeDaily" type="button" role="tab" aria-selected="true" aria-controls="gachaPanel" data-mode="daily"><span class="mode-tab-mark">◆</span><span>오늘의 뽑기</span></button>
          <button class="mode-tab" id="modeUnlimited" type="button" role="tab" aria-selected="false" aria-controls="gachaPanel" data-mode="unlimited"><span class="mode-tab-mark">∞</span><span>무한 뽑기</span></button>
        </div>
        <p class="mode-description" id="modeDescription">오늘 지정된 상자로 한 번만 뽑을 수 있습니다.</p>
      </section>

      <div id="gachaPanel" role="tabpanel" aria-labelledby="modeDaily">
        <section class="sr-card vault" id="vaultPanel">
          <div class="vault-label">선택한 상자</div>
          <div class="vault-boxname" id="vaultBoxName">—</div>
          <div class="vault-hint">리스트레인트 링 Lv.4 · 컨티뉴어스 링 Lv.4 · 생명의 연마석이 나오면 당첨입니다</div>
          <div class="daily-status" id="dailyStatus" aria-live="polite"></div>
          <div class="drawbtns"><button class="btn primary" id="drawOne" type="button">무한 뽑기</button></div>
          <div class="result" id="result"></div>
        </section>

        <section class="sr-card">
          <h2 id="boxSelectorTitle">오늘의 지정 상자</h2>
          <div class="boxrow" id="boxrow" role="listbox" aria-label="반지 상자 선택"></div>
        </section>
      </div>
    </section>

    <aside class="sr-right">
      <section class="sr-card">
        <button class="probtoggle-btn" id="probToggleBtn" type="button" aria-expanded="true" aria-controls="probTableWrap"><span class="car">▸</span> <span id="probToggleLabel">확률표 접기</span></button>
        <p class="probtoggle-note">종류를 먼저 뽑은 뒤, 반지가 나온 경우에만 레벨을 뽑습니다. 생명의 연마석에는 레벨이 없습니다.</p>

  // 보스 아이콘·난이도 배지는 보스 수익 계산기(boss_income_calc.html)와 같은 표기를 쓴다.
  var BOSS_ICON = {
    "스우":"suu", "데미안":"damien", "가엔슬":"guardian_angel_slime", "루시드":"lucid",
    "윌":"will", "더스크":"dusk", "듄켈":"dunkel", "진 힐라":"jin_hilla", "세렌":"seren",
    "검은 마법사":"black_mage", "칼로스":"watcher_kalos", "카링":"kaling",
    "최초의 대적자":"first_challenger", "찬란한 흉성":"radiant", "림보":"limbo",
    "발드릭스":"baldrix", "유피테르":"jupiter"
  };
  // 상자 카드가 좁아서 긴 이름은 통용되는 줄임말로 표시한다.
  var BOSS_SHORT = { "가디언 엔젤 슬라임":"가엔슬", "최초의 대적자":"최초대적자" };
  var DIFFICULTY = {
    "이지":{ key:"easy", mark:"E" },
    "노멀":{ key:"normal", mark:"N" },
    "하드":{ key:"hard", mark:"H" },
    "카오스":{ key:"chaos", mark:"C" },
    "익스트림":{ key:"extreme", mark:"EX" }
  };

  // "루시드(이지/노멀)" → { name:"루시드", diffs:["이지","노멀"] }
  function parseBoss(text){
    var match = /^(.+?)\(([^)]+)\)$/.exec(text);
    var name = match ? match[1].trim() : text.trim();
    var diffs = match ? match[2].split("/").map(function(d){ return d.trim(); }) : [];
    return { name: BOSS_SHORT[name] || name, iconKey: BOSS_ICON[BOSS_SHORT[name] || name] || BOSS_ICON[name], diffs: diffs };
  }

  function bossChipHtml(boss){
    var icon = boss.iconKey
      ? '<img class="boss-chip-icon" src="icons/boss/' + boss.iconKey + '.webp" alt="" loading="lazy">'
      : '';
    var marks = boss.diffs.map(function(d){
      var badge = DIFFICULTY[d];
      if (!badge) return '';
      return '<span class="boss-diff difficulty-' + badge.key + '" title="' + d + '">' + badge.mark + '</span>';
    }).join("");
    return '<span class="boss-chip">' + icon +
      '<span class="boss-chip-name">' + boss.name + '</span>' + marks + '</span>';
  }

  BOXES.forEach(function(box){
    box.bossList = box.bosses.map(parseBoss);
  });

  // normalize so each box's item list and level list each sum to exactly 100
  BOXES.forEach(function(box){
    var itemSum = box.items.reduce(function(a,i){ return a+i.p; }, 0);
    box.items.forEach(function(i){ i.p = i.p * 100 / itemSum; });
    var lvSum = box.levels.reduce(function(a,l){ return a+l.p; }, 0);
    box.levels.forEach(function(l){ l.p = l.p * 100 / lvSum; });
  });

  function fmt(n){
    if (n >= 10) return n.toFixed(2);
    if (n >= 1) return n.toFixed(3);
    return n.toFixed(4);
  }

  function weightedPick(list){
    var total = list.reduce(function(a,i){ return a + i.p; }, 0);
    var r = Math.random() * total;
    for (var i=0;i<list.length;i++){
      r -= list[i].p;
      if (r <= 0) return list[i];
    }
    return list[list.length-1];
  }

  function koreaDateKey(){
    var parts = new Intl.DateTimeFormat("en-US", {
      timeZone:"Asia/Seoul", year:"numeric", month:"2-digit", day:"2-digit"
    }).formatToParts(new Date());
    var date = {};
    parts.forEach(function(part){ date[part.type] = part.value; });
    return date.year + "-" + date.month + "-" + date.day;
  }

  function dailyBoxIdForDate(dateKey){
    var values = dateKey.split("-").map(Number);
    var dayNumber = Math.floor(Date.UTC(values[0], values[1] - 1, values[2]) / 86400000);
    return dayNumber % 2 === 0 ? "life" : "white";
  }

  function boxById(id){
    for (var i=0;i<BOXES.length;i++) if (BOXES[i].id === id) return BOXES[i];
    return null;
  }

  function restoreDailyDraw(){
    try {
      var saved = JSON.parse(localStorage.getItem(DAILY_STORAGE_KEY));
      if (!saved || saved.date !== koreaDateKey()) return null;
      if (saved.boxId !== dailyBoxIdForDate(saved.date)) return null;
      var box = boxById(saved.boxId);
      if (!box) return null;
      var item = box.items.find(function(candidate){ return candidate.name === saved.name; });
      if (!item) return null;
      if (item.name === "생명의 연마석") {
        return {
          date:saved.date, boxId:box.id,
          entry:{ name:item.name, lv:null, itemP:item.p, lvP:null, joint:item.p, noLevel:true }
        };
      }
      var level = box.levels.find(function(candidate){ return candidate.lv === Number(saved.lv); });
      if (!level) return null;
      return {
        date:saved.date, boxId:box.id,
        entry:{ name:item.name, lv:level.lv, itemP:item.p, lvP:level.p, joint:item.p * level.p / 100 }
      };
    } catch (error) {
      return null;
    }
  }

  function saveDailyDraw(box, entry){
    try {
      localStorage.setItem(DAILY_STORAGE_KEY, JSON.stringify({
        date:koreaDateKey(), boxId:box.id, name:entry.name, lv:entry.lv
      }));
    } catch (error) {
      // 저장이 제한된 환경에서도 현재 탭에서는 중복 뽑기를 막습니다.
    }
  }

  var restoredDaily = restoreDailyDraw();
  var state = {
    mode:"daily",
    unlimitedBoxId:"life",
    dailyBoxId:restoredDaily ? restoredDaily.boxId : dailyBoxIdForDate(koreaDateKey()),
    unlimitedResult:null,
    dailyDate: restoredDaily ? restoredDaily.date : null,
    dailyResult: restoredDaily ? restoredDaily.entry : null
  };

  var ACCENT = { jade:"#55b787", red:"#e2664a", black:"#c3c8d6", white:"#e8e9ec", life:"#ffd36a" };
  var BOX_GRADE = { life:"S", white:"A", black:"B", red:"C", jade:"D" };

  var boxrow = document.getElementById("boxrow");

    stopDrawEffect();

    vaultPanel.classList.add("is-drawing");
    drawEffectTimer = window.setTimeout(function(){
      vaultPanel.classList.remove("is-drawing");
      drawEffectTimer = null;
    }, 820);

  function syncDailyState(){
    var today = koreaDateKey();
    var assignedBoxId = dailyBoxIdForDate(today);
    if (state.dailyBoxId === assignedBoxId && (!state.dailyDate || state.dailyDate === today)) return;
    var saved = restoreDailyDraw();
    state.dailyBoxId = assignedBoxId;
    state.dailyDate = saved ? saved.date : null;
    state.dailyResult = saved ? saved.entry : null;
  }

  function currentBox(){
    var boxId = state.mode === "daily" ? state.dailyBoxId : state.unlimitedBoxId;
    return boxById(boxId) || BOXES[0];
  }

  function renderModeStatus(){
    var daily = state.mode === "daily";
    var used = daily && !!state.dailyResult;
    drawOneBtn.disabled = used;
    drawOneBtn.textContent = daily ? (used ? "오늘의 뽑기 완료" : "오늘의 뽑기") : "무한 뽑기";
    dailyStatus.classList.toggle("used", used);
    dailyStatus.textContent = daily
      ? (used ? "오늘의 기회 0/1 · 내일 다시 뽑을 수 있어요." : "오늘의 기회 1/1")
      : "횟수 제한 없음";
    modeDescription.textContent = daily
      ? "오늘의 지정 상자는 " + currentBox().name.replace("의 보스 반지 상자", "") + "입니다."
      : "원하는 상자를 골라 제한 없이 뽑습니다.";

  function renderModeTabs(){
    modeTabs.forEach(function(tab){

  function renderBoxRow(){

  function renderVault(){

  function drawOnce(box){
    var item = weightedPick(box.items);
    if (item.name === "생명의 연마석") {
      return { name:item.name, lv:null, itemP:item.p, lvP:null, joint:item.p, noLevel:true };
    }
    var lvl = weightedPick(box.levels);
    var joint = item.p * lvl.p / 100;
    return { name: item.name, lv: lvl.lv, itemP: item.p, lvP: lvl.p, joint: joint };
  }

  var JACKPOT_RING_NAMES = ["리스트레인트 링", "컨티뉴어스 링"];
  function isJackpot(entry){
    if (entry.name === "생명의 연마석") return true;
    return entry.lv === 4 && JACKPOT_RING_NAMES.indexOf(entry.name) !== -1;
  }

    var jackpot = isJackpot(entry);
    var levelBadge = entry.noLevel
      ? '<span class="result-lv">재료</span>'

    var probabilityText = entry.noLevel
      ? '아이템 종류 확률 <b>' + fmt(entry.itemP) + '%</b> · 레벨 추첨 없음 = 이번 결과 확률 <b>' + fmt(entry.joint) + '%</b>'
      : '반지 종류 확률 <b>' + fmt(entry.itemP) + '%</b> × 레벨 확률 <b>' + fmt(entry.lvP) + '%</b> = 이번 결과 확률 <b>' + fmt(entry.joint) + '%</b>';
    resultEl.innerHTML =
      '<div class="result-card' + (jackpot ? ' jackpot' : '') + '">' +

          '<span class="result-item">' +
            '<span class="result-icon-stage">' + iconImg(itemIcon(entry.name), "result-icon", entry.name, false) + '</span>' +
            '<span class="result-name">' + entry.name + '</span>' +
          '</span>' +
          levelBadge +
        '</div>' +
        '<div class="result-prob">' + probabilityText + '</div>' +

          '<span class="share-feedback" id="shareFeedback" aria-live="polite">이미지 하단에 사이트 주소가 포함됩니다.</span>' +
        '</div>' +
      '</div>';
    document.getElementById("copyImageBtn").addEventListener("click", function(){
      copyResultImage(entry);
    });
  }

  function roundedRect(ctx, x, y, width, height, radius){
    var r = Math.min(radius, width / 2, height / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + width, y, x + width, y + height, r);
    ctx.arcTo(x + width, y + height, x, y + height, r);
    ctx.arcTo(x, y + height, x, y, r);
    ctx.arcTo(x, y, x + width, y, r);
    ctx.closePath();
  }

  function loadCanvasImage(src){
    return new Promise(function(resolve, reject){
      var image = new Image();
      image.onload = function(){ resolve(image); };
      image.onerror = reject;
      image.src = src;
    });
  }

  async function createShareImage(entry){
    var box = currentBox();
    var accent = ACCENT[box.id] || ACCENT.jade;
    var modeTitle = state.mode === "daily" ? "오늘의 시드링" : "무한 시드링 뽑기";
    var images = await Promise.all([
      loadCanvasImage(canvasAsset(BOX_ICON[box.id])),
      loadCanvasImage(canvasAsset(itemIcon(entry.name)))
    ]);
    var canvas = document.createElement("canvas");
    canvas.width = 1080;
    canvas.height = 1080;
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;

    var background = ctx.createLinearGradient(0, 0, 1080, 1080);
    background.addColorStop(0, "#0f1115");
    background.addColorStop(.62, "#171a21");
    background.addColorStop(1, "#0b0d12");
    ctx.fillStyle = background;
    ctx.fillRect(0, 0, 1080, 1080);

    var glow = ctx.createRadialGradient(820, 170, 20, 820, 170, 520);
    glow.addColorStop(0, accent + "55");
    glow.addColorStop(1, accent + "00");
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, 1080, 700);

    roundedRect(ctx, 54, 54, 972, 972, 42);
    ctx.fillStyle = "rgba(23,26,33,.94)";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = accent + "99";
    ctx.stroke();

    ctx.textAlign = "left";
    ctx.fillStyle = "#7b8090";
    ctx.font = "24px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText("SEED RING DRAW · " + (state.mode === "daily" ? koreaDateKey() : "SIMULATOR"), 104, 126);
    ctx.fillStyle = "#e8e9ec";
    ctx.font = "700 58px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText(modeTitle, 104, 202);

    roundedRect(ctx, 104, 246, 872, 148, 28);
    ctx.fillStyle = "rgba(17,20,26,.62)";
    ctx.fill();
    ctx.strokeStyle = "rgba(232,233,236,.12)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.drawImage(images[0], 132, 266, 118, 108);
    ctx.fillStyle = "#9a9fab";
    ctx.font = "24px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText("선택한 상자", 286, 297);
    ctx.fillStyle = "#e8e9ec";
    ctx.font = "700 34px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText(box.name, 286, 350);

    roundedRect(ctx, 380, 442, 320, 320, 54);
    ctx.fillStyle = "rgba(17,20,26,.72)";
    ctx.fill();
    ctx.strokeStyle = accent;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.shadowColor = accent;
    ctx.shadowBlur = 34;
    ctx.drawImage(images[1], 430, 492, 220, 220);
    ctx.shadowBlur = 0;

    ctx.textAlign = "center";
    ctx.fillStyle = "#e8e9ec";
    ctx.font = "700 48px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText(entry.name, 540, 838);
    ctx.fillStyle = accent;
    ctx.font = "700 34px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText(entry.noLevel ? "레벨 없음 · 재료" : "Lv." + entry.lv, 540, 890);
    ctx.fillStyle = "#9a9fab";
    ctx.font = "25px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText("이번 결과 확률 " + fmt(entry.joint) + "%", 540, 942);

    if (isJackpot(entry)) {
      roundedRect(ctx, 404, 952, 272, 42, 21);
      ctx.fillStyle = "#ffd36a";
      ctx.fill();
      ctx.fillStyle = "#241c08";
      ctx.font = "700 23px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
      ctx.fillText("★ 당첨", 540, 981);
    }

    ctx.fillStyle = "#7b8090";
    ctx.font = "19px 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif";
    ctx.fillText(SHARE_URL.replace(/^https?:\/\//, ""), 540, 1020);

    return new Promise(function(resolve, reject){
      canvas.toBlob(function(blob){
        if (blob) resolve(blob);
        else reject(new Error("image creation failed"));
      }, "image/png");
    });
  }

  function downloadResultImage(blob){
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url;
    link.download = "seedring-result-" + koreaDateKey() + ".png";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  async function copyResultImage(entry){
    var feedback = document.getElementById("shareFeedback");
    feedback.textContent = "이미지를 만드는 중…";
    var blobPromise = createShareImage(entry);
    var canWriteImage = window.isSecureContext && navigator.clipboard && navigator.clipboard.write && window.ClipboardItem;

    if (canWriteImage) {
      try {
        // 이미지 생성을 기다리기 전에 쓰기를 요청해야 클릭 권한이 유지됩니다.
        await navigator.clipboard.write([
          new window.ClipboardItem({ "image/png":blobPromise })
        ]);
        feedback.textContent = "결과 이미지를 클립보드에 복사했습니다.";
        return;
      } catch (clipboardError) {
        try {
          var fallbackBlob = await blobPromise;
          downloadResultImage(fallbackBlob);
          feedback.textContent = "브라우저가 이미지 복사를 차단해 PNG로 저장했습니다.";
        } catch (imageError) {
          feedback.textContent = "결과 이미지를 만들지 못했습니다. 페이지를 새로고침해 주세요.";
        }
        return;
      }
    }

    try {
        var blob = await blobPromise;
        downloadResultImage(blob);
        feedback.textContent = "이미지 복사가 지원되지 않아 PNG로 저장했습니다.";
    } catch (imageError) {
      feedback.textContent = "결과 이미지를 만들지 못했습니다. 페이지를 새로고침해 주세요.";
    }
  }

  function doDrawOne(){
    if (state.mode === "daily") syncDailyState();
    if (state.mode === "daily" && state.dailyResult) return;
    var box = currentBox();
    var entry = drawOnce(box);
    if (state.mode === "daily") {
      state.dailyDate = koreaDateKey();
      state.dailyResult = entry;
      saveDailyDraw(box, entry);
      renderBoxRow();
    } else {
      state.unlimitedResult = entry;
    }
    renderSingleResult(entry);
    playDrawEffect();
    renderModeStatus();
  }

  function renderProbTable(){
    var box = currentBox();
    var levelHtml = box.levels.map(function(l){
      return '<span class="levelchip' + (l.lv === 4 ? ' jackpot-lv' : '') + '">Lv.' + l.lv + ' <b>' + fmt(l.p) + '%</b></span>';
    }).join("");

    var rows = box.items.map(function(it){
      var isMaterial = it.name === "생명의 연마석";
      var jackpotRing = JACKPOT_RING_NAMES.indexOf(it.name) !== -1;
      var win = isMaterial || jackpotRing;
      var lv3 = box.levels.find(function(l){ return l.lv === 3; });
      var lv4 = box.levels.find(function(l){ return l.lv === 4; });
      var lv3Cell = !isMaterial && lv3
        ? '<td class="num final-prob" data-label="Lv.3 최종">' + fmt(it.p * lv3.p / 100) + '%</td>'
        : '<td class="num impossible" data-label="Lv.3 최종">—</td>';
      var lv4Cell = !isMaterial && lv4
        ? '<td class="num final-prob lv4" data-label="Lv.4 최종">' + fmt(it.p * lv4.p / 100) + '%</td>'
        : '<td class="num impossible" data-label="Lv.4 최종">—</td>';
      var winLabel = isMaterial
        ? ' <span class="jackpot-mark">★ 당첨 · 레벨 없음</span>'
        : (jackpotRing ? ' <span class="jackpot-mark">★ Lv.4 당첨</span>' : '');
      return '<tr' + (win ? ' class="jackpot-row"' : '') + '><td><span class="table-item">' +
        '<span class="table-icon-stage">' + iconImg(itemIcon(it.name), "table-icon", "", true) + '</span>' +
        '<span>' + it.name + winLabel + '</span>' +
        '</span></td><td class="num" data-label="종류 확률">' + fmt(it.p) + '%</td>' + lv3Cell + lv4Cell + '</tr>';
    }).join("");

    probTableWrap.innerHTML =
      '<div class="levelrow">' + levelHtml + '</div>' +
      '<div class="tablescroll"><table class="probtable">' +
        '<caption>' + box.name + ' · 반지 종류 및 레벨을 함께 뽑을 최종 확률</caption>' +
        '<thead><tr><th>반지</th><th>종류 확률</th><th>Lv.3 최종</th><th>Lv.4 최종</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table></div>';
  }

  drawOneBtn.addEventListener("click", doDrawOne);

  modeTabs.forEach(function(tab, index){
    tab.addEventListener("click", function(){
      state.mode = tab.dataset.mode;
      if (state.mode === "daily") syncDailyState();
      renderModeTabs();
      renderBoxRow();
      renderVault();
      renderProbTable();
    });
    tab.addEventListener("keydown", function(event){
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      var next = event.key === "ArrowRight" ? (index + 1) % modeTabs.length : (index - 1 + modeTabs.length) % modeTabs.length;
      modeTabs[next].click();
      modeTabs[next].focus();
    });
  });

  probToggleBtn.addEventListener("click", function(){
    var expanded = probToggleBtn.getAttribute("aria-expanded") === "true";
    probToggleBtn.setAttribute("aria-expanded", String(!expanded));
    probTableWrap.hidden = expanded;
    probToggleLabel.textContent = expanded ? "확률표 펼쳐보기" : "확률표 접기";
  });

  renderModeTabs();
  renderBoxRow();
  renderVault();
  renderProbTable();
})();
</script>
</body>
</html>
